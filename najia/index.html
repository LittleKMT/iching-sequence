  <title>六十四卦・六親持世閃卡</title>
  <style>
    :root { --scale: 1; --blue: #123f61; --pale: #e9f3f8; --cream: #f6f2e9; --ink: #14202a; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    button { font: inherit; white-space: nowrap; }

    .picker-order { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 11px; }
    .picker-sort { min-height: 43px; padding: 6px 3px; border: 1px solid #aebbc3; border-radius: 12px; color: var(--blue); background: #fff; font-size: calc(.98rem * var(--scale)); font-weight: 950; }
    .picker-sort.active { color: #fff; border-color: var(--blue); background: var(--blue); }

    .picker-group-title { grid-column: 1 / -1; margin: 8px 0 0; padding: 7px 10px; border-radius: 10px; color: #fff; background: var(--blue); font-size: calc(1.08rem * var(--scale)); font-weight: 950; text-align: left; }

    .coordinate-note { margin: -2px 0 7px; color: #61727d; font-size: calc(.9rem * var(--scale)); font-weight: 900; line-height: 1.3; }
    .answer-button { padding: 8px 22px; }

    .quiz-choices.answered { display: none; }

    .quiz-choice.correct { color: #fff; border-color: #19733e; background: #19733e; }
    .quiz-choice.wrong { color: #fff; border-color: #b52d2d; background: #b52d2d; }

    function renderWorldFlash(){const r=records[worldFlashDeck[worldFlashPosition]],worldLine=r.lines[r.world-1],branchElement=`${worldLine.stemBranch.slice(-1)}${worldLine.element}`,seen=worldFlashSeen[r.index]||0,topics=[...worldElementChoices,'全部'].map(element=>{const active=element==='全部'?worldFlashElements.length===worldElementChoices.length:worldFlashElements.includes(element);return`<button class="holding-flash-topic ${active?'active':''}" data-world-flash-element="${element}" aria-pressed="${active}">${element}</button>`}).join(''),front=`${hexMarkup(r.bits,false,r.world,false)}<div class="answer-name holding-flash-name"><strong>${r.name}</strong></div><div class="practice-tap">點一下翻到世爻納甲</div>`,back=`${hexMarkup(r.bits,false,r.world)}<div class="answer-name holding-flash-name"><strong>${r.name}</strong></div><div class="holding-flash-answer">世在${lineName(r.world)}</div><div class="practice-answer-label">世爻納甲</div><div class="practice-answer">${branchElement}</div><div class="practice-tap">再點一下，下一張</div>`;worldFlashScreen.innerHTML=`<article class="card flash-card"><div class="stage-badge">世爻五行分組練習・不計分</div><div class="holding-flash-topics" aria-label="世爻五行分組">${topics}</div><div class="ordinal">${worldFlashLabel()}・第 ${worldFlashPosition+1} / ${worldFlashDeck.length} 張<div class="holding-flash-count">這張已看 ${seen} 次</div></div><div class="practice-face holding-flash-face" id="world-flash-face" role="button" tabindex="0" aria-label="點一下翻面">${worldFlashRevealed?back:front}</div><button class="shuffle-button" id="world-flash-reset">重新隨機本組</button></article>`;document.querySelectorAll('[data-world-flash-element]').forEach(button=>button.onclick=()=>toggleWorldFlashElement(button.dataset.worldFlashElement));const face=document.getElementById('world-flash-face'),advance=()=>{if(worldFlashRevealed){worldFlashPosition=(worldFlashPosition+1)%worldFlashDeck.length;worldFlashRevealed=false;recordWorldFlashSeen(worldFlashDeck[worldFlashPosition]);saveWorldFlashProgress()     const trigramFullNames={7:{name:'乾',nature:'天'},3:{name:'兌',nature:'澤'},5:{name:'離',nature:'火'},1:{name:'震',nature:'雷'},6:{name:'巽',nature:'風'},2:{name:'坎',nature:'水'},4:{name:'艮',nature:'山'},0:{name:'坤',nature:'地'}};

    function resetDrawPractice(index=drawPracticeIndex){drawPracticeIndex=(index+64)%64;drawLines=Array(6).fill(null);drawParts=Array.from({length:6},()=>new Set());drawWrongRows=new Set();drawGestureMessage='';drawStroke=null}

    function bindDrawBoard(){const board=document.getElementById('draw-board');board.onpointerdown=e=>{if(!e.isPrimary||e.button!==0)return;const rowElement=e.target.closest('.draw-row');if(!rowElement||!board.contains(rowElement))return;e.preventDefault();const row=Number(rowElement.dataset.drawRow),rect=rowElement.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;if(drawLines[row]!==null){drawLines[row]=null;drawParts[row]=new Set()}drawWrongRows.delete(row);drawGestureMessage='';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),line=document.createElementNS('http://www.w3.org/2000/svg','line');svg.setAttribute('class','draw-ink');svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);line.setAttribute('x1',x);line.setAttribute('y1',y);line.setAttribute('x2',x);line.setAttribute('y2',y);svg.appendChild(line);rowElement.appendChild(svg);drawStroke={row,rowElement,rect,x1:x,y1:y,x2:x,y2:y,line,pointerId:e.pointerId};try{board.setPointerCapture(e.pointerId)}catch(_){}};board.onpointermove=e=>{if(!drawStroke||e.pointerId!==drawStroke.pointerId)return;e.preventDefault();drawStroke.x2=Math.max(0,Math.min(drawStroke.rect.width,e.clientX-drawStroke.rect.left));drawStroke.y2=Math.max(0,Math.min(drawStroke.rect.height,e.clientY-drawStroke.rect.top));drawStroke.line.setAttribute('x2',drawStroke.x2);drawStroke.line.setAttribute('y2',drawStroke.y2)};board.onpointerup=e=>{if(!drawStroke||e.pointerId!==drawStroke.pointerId)return;e.preventDefault();const{row,rect,x1,y1,x2,y2}=drawStroke,dx=Math.abs(x2-x1),dy=Math.abs(y2-y1),mid=(x1+x2)/2,position=mid/rect.width,isTap=dx<=18&&dy<=18;drawStroke=null;if(isTap&&position>=.35&&position<=.65){drawLines[row]=true;drawParts[row]=new Set()}else if(isTap){drawParts[row].add(position<.5?'left':'right');if(drawParts[row].size===2){drawLines[row]=false;drawParts[row]=new Set()}else drawGestureMessage='再點另一邊，就會成為陰爻。'}else if(dy>32){drawGestureMessage='請點中間或左右兩邊，也可以橫向畫線。'}else if(dx>=rect.width*.55     function renderDrawPractice(shouldAlign=false){const target=records[drawPracticeIndex],assessment=drawnAssessment(),nextBlank=drawLines.findIndex(line=>line===null),rows=drawLines.map((line,row)=>{const lineNumber=6-row,classes=['draw-row'];if(line!==null)classes.push('complete');if(drawWrongRows.has(row))classes.push('wrong');if(row===nextBlank)classes.push('active');return`<div class="${classes.join(' ')}" data-draw-row="${row}" aria-label="第${lineNumber}爻畫圖區"><span class="draw-row-label">第${lineNumber}爻</span>${drawLineMarkup(row)}</div>`}).join('');let feedback,feedbackClass='';if(assessment.complete&&assessment.correct){feedback=`畫對了 ✓　這是「${fullHexName(target)}」`;feedbackClass='correct'}else if(assessment.complete){feedback=`你畫成「${fullHexName(assessment.drawn)}」。紅框是需要修正的爻，直接在紅框內重畫。`;feedbackClass='wrong'}else if(drawGestureMessage)feedback=drawGestureMessage;else if(drawWrongRows.size)feedback='直接重畫紅框內的爻，改好後再確認。';else if(drawParts.some(parts=>parts.size))feedback='再點或畫另一邊，就會成為陰爻。';else feedback=nextBlank>=0?`請由上往下畫，現在畫第 ${6-nextBlank} 爻。`:'請完成六爻。';drawPracticeScreen.innerHTML=`<article class="card draw-card"><div class="stage-badge">⑤ 畫卦練習</div><div class="draw-target-label">請畫出</div><h2 class="draw-target">${fullHexName(target)}</h2><p class="draw-help">點中間＝陽爻；左、右各點一下＝陰爻。也可以直接橫畫。</p><div class="draw-board" id="draw-board" data-target-bits="${target.bits}" aria-label="六爻畫板">${rows}</div><div class="draw-feedback ${feedbackClass}" id="draw-feedback" aria-live="polite">${feedback}</div><div class="draw-actions"><button id="draw-clear">全部重畫</button><button class="draw-next" id="draw-next" ${assessment.correct?'':'disabled'}>確定・下一題</button></div></article>`;bindDrawBoard();document.getElementById('draw-clear').onclick=()=>{resetDrawPractice();renderDrawPractice()};document.getElementById('draw-next').onclick=()=>{let next;do next=Math.floor(Math.random()*64);while(next===drawPracticeIndex);resetDrawPractice(next);renderDrawPractice(true)};if(shouldAlign)alignCa     function showDrawPractice(){if(!drawPracticeStarted){drawPracticeStarted=true;resetDrawPractice(0)}currentMode='drawPractice';hideScreens();drawPracticeScreen.hidden=false;setActive('drawPractice');renderDrawPractice(true)}
    function shuffle(){deck=Array.from({length:64},(_,i)=>i);boostedFor(flashType).forEach(index=>deck.push(index,index));for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}deckPosition=0}
