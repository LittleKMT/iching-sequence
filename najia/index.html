<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123f61">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="六親持世">
  <title>六十四卦・六親持世閃卡</title>
  <style>
    :root { --scale: 1; --blue: #123f61; --pale: #e9f3f8; --cream: #f6f2e9; --ink: #14202a; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--cream); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
    button { font: inherit; white-space: nowrap; }
    .shell { width: min(100%, 620px); margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 10px calc(30px + env(safe-area-inset-bottom)); }
    header { padding: 6px 4px 10px; text-align: center; }
    h1 { margin: 0; color: var(--blue); font-size: calc(1.6rem * var(--scale)); line-height: 1.2; }
    .subtitle { margin: 4px 0 0; color: #62717a; font-size: calc(.9rem * var(--scale)); }
    .controls { margin-bottom: 9px; padding: 4px 0; }
    .control-row { display: grid; gap: 6px; margin-bottom: 5px; }
    .control-row.two { grid-template-columns: 1fr 1fr; }
    .control-row.three { grid-template-columns: repeat(3, 1fr); margin-bottom: 0; }
    .control-row.four { grid-template-columns: repeat(2, 1fr); }
    .control.full { grid-column: 1 / -1; }
    .control { min-height: 46px; padding: 8px 3px; border: 1px solid #b7c3cb; border-radius: 13px; color: #1c2b35; background: #fff; font-size: calc(1.22rem * var(--scale)); font-weight: 950; line-height: 1; }
    .control.active { color: #fff; border-color: var(--blue); background: var(--blue); }
    .training-label { margin: 7px 0 6px; color: var(--blue); font-size: calc(.94rem * var(--scale)); font-weight: 950; text-align: left; }
    .stage-control { min-height: 54px; }
    .screen[hidden] { display: none !important; }
    .section-title { margin: 14px 0 5px; color: var(--blue); font-size: calc(1.35rem * var(--scale)); }
    .intro { margin: 0 0 10px; color: #60707a; font-size: calc(.95rem * var(--scale)); line-height: 1.45; }
    .picker-order { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 11px; }
    .picker-sort { min-height: 43px; padding: 6px 3px; border: 1px solid #aebbc3; border-radius: 12px; color: var(--blue); background: #fff; font-size: calc(.98rem * var(--scale)); font-weight: 950; }
    .picker-sort.active { color: #fff; border-color: var(--blue); background: var(--blue); }
    .picker-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    .picker-group-title { grid-column: 1 / -1; margin: 8px 0 0; padding: 7px 10px; border-radius: 10px; color: #fff; background: var(--blue); font-size: calc(1.08rem * var(--scale)); font-weight: 950; text-align: left; }
    .picker-group-title:first-child { margin-top: 0; }
    .picker-item { min-width: 0; padding: 11px 4px 9px; border: 1px solid #c9d3d9; border-radius: 15px; color: var(--blue); background: #fff; }
    .picker-name { display: block; margin-top: 7px; font-size: calc(1.32rem * var(--scale)); font-weight: 950; }
    .picker-no { display: block; margin-top: 2px; color: #6c7a83; font-size: calc(.72rem * var(--scale)); }
    .hex-lines { display: grid; gap: 9px; width: min(76vw, 270px); margin: 0 auto; color: var(--blue); }
    .yao { display: flex; gap: 24px; height: 20px; }
    .yao span { display: block; flex: 1; border-radius: 1px; background: currentColor; }
    .picker-hex { gap: 4px; width: 76px; }
    .picker-hex .yao { gap: 8px; height: 7px; }
    .card { overflow: hidden; padding: 14px 12px; border: 1px solid #d1d5d3; border-radius: 20px; background: #fff; box-shadow: 0 5px 18px #2033250d; text-align: center; }
    .ordinal { color: #6a7880; font-size: calc(.82rem * var(--scale)); }
    .card .hex-lines { margin-top: 10px; }
    .hex-name { margin: 8px 0 5px; color: var(--blue); font-size: calc(2.15rem * var(--scale)); font-weight: 950; }
    .holding { margin: 8px 0 10px; padding: 10px 8px; border-radius: 13px; color: #fff; background: var(--blue); font-size: calc(1.65rem * var(--scale)); font-weight: 950; }
    .line-table { overflow: hidden; margin-top: 8px; border: 1px solid #ced9df; border-radius: 14px; text-align: left; }
    .line-row { display: grid; grid-template-columns: minmax(4.6rem, .85fr) minmax(8.4rem, 1.35fr) minmax(4.6rem, .85fr); align-items: center; min-height: 70px; padding: 8px 10px; border-top: 1px solid #dfe7eb; font-size: calc(1.16rem * var(--scale)); }
    .line-row:first-child { border-top: 0; }
    .line-row.world { background: var(--pale); }
    .najia { justify-self: start; font-weight: 950; letter-spacing: .04em; }
    .relation { justify-self: end; color: var(--blue); font-weight: 950; }
    .line-center { display: grid; grid-template-rows: 18px 1.35rem; align-items: center; gap: 4px; }
    .answer-yao { display: flex; gap: 18px; height: 16px; }
    .answer-yao span { display: block; flex: 1; background: #111; }
    .position { min-height: 1.35rem; color: #6a7880; text-align: center; font-size: calc(.96rem * var(--scale)); font-weight: 950; line-height: 1.2; }
    .line-row.world .position { color: #c22626; }
    .line-row.response .position { color: #1768a5; }
    .hint { margin: 9px 0 0; color: #66757d; font-size: calc(.84rem * var(--scale)); font-weight: 750; }
    .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
    .nav button, .answer-button, .back-button, .shuffle-button { min-height: 48px; border: 1px solid #abbac3; border-radius: 13px; color: var(--blue); background: #fff; font-size: calc(1.28rem * var(--scale)); font-weight: 950; line-height: 1; }
    .back-button, .shuffle-button { width: 100%; margin-top: 9px; color: #fff; border-color: var(--blue); background: var(--blue); }
    .flash-question { margin: 8px 0 10px; font-size: calc(1.32rem * var(--scale)); font-weight: 950; }
    .flash-card > .hex-lines { gap: 10px; width: min(84vw, 315px); margin-top: 0; }
    .flash-card > .hex-lines .yao { gap: 27px; height: 25px; }
    .flash-card .flash-question { margin: 8px 0 7px; font-size: calc(1.68rem * var(--scale)); line-height: 1.2; }
    .stage-badge { display: inline-block; margin-bottom: 4px; padding: 5px 10px; border-radius: 999px; color: #fff; background: var(--blue); font-size: calc(.82rem * var(--scale)); font-weight: 950; }
    .coordinate-prompt { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; width: min(92%, 390px); margin: 14px auto 12px; }
    .coordinate-prompt span { display: flex; min-height: 104px; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px; border: 3px solid var(--blue); border-radius: 17px; color: var(--blue); background: var(--pale); font-weight: 950; line-height: 1; }
    .coordinate-prompt small { margin-bottom: 7px; color: #61727d; font-size: calc(.88rem * var(--scale)); font-weight: 900; }
    .coordinate-prompt strong { font-size: calc(2.25rem * var(--scale)); font-weight: 950; }
    .coordinate-note { margin: -2px 0 7px; color: #61727d; font-size: calc(.9rem * var(--scale)); font-weight: 900; line-height: 1.3; }
    .answer-button { padding: 8px 22px; }
    .quiz-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 10px 0 4px; }
    .quiz-choices.answered { display: none; }
    .quiz-choice { min-height: 48px; border: 2px solid #aebbc3; border-radius: 13px; color: var(--blue); background: #fff; font-size: calc(1.5rem * var(--scale)); font-weight: 950; line-height: 1; }
    .quiz-choice.correct { color: #fff; border-color: #19733e; background: #19733e; }
    .quiz-choice.wrong { color: #fff; border-color: #b52d2d; background: #b52d2d; }
    .quiz-choice:disabled { opacity: 1; }
    .palace-choices .quiz-choice { min-height: 58px; font-size: calc(2rem * var(--scale)); }
    .kin-choices { grid-template-columns: repeat(3, 1fr); }
    .kin-choices .quiz-choice { min-height: 56px; font-size: calc(1.72rem * var(--scale)); }
    .quiz-feedback { min-height: 1.8rem; margin: 7px 0 2px; font-size: calc(1.12rem * var(--scale)); font-weight: 950; }
    .quiz-feedback.correct { color: #19733e; }
    .quiz-feedback.wrong { color: #b52d2d; }
    .flash-answer[hidden] { display: none; }
    .flash-answer { margin-top: 10px; }
    .flash-answer .holding { margin: 5px 0 6px; padding-block: 7px; }
    .flash-answer .line-row { min-height: 46px; padding-block: 1px; font-size: calc(1.5rem * var(--scale)); }
    .flash-answer .najia, .flash-answer .relation { line-height: 1; }
    .flash-answer .line-center { grid-template-rows: 17px calc(1.3rem * var(--scale)); gap: 0; }
    .flash-answer .position { min-height: calc(1.3rem * var(--scale)); font-size: calc(1.25rem * var(--scale)); line-height: 1; }
    .flash-card > .nav { margin-top: 5px; }
    .flash-card > .shuffle-button { margin-top: 5px; }
    .answer-name { margin: 0 0 7px; color: #687781; font-size: calc(.82rem * var(--scale)); font-weight: 850; }
    .answer-name strong { display: block; margin-top: 1px; color: var(--blue); font-size: calc(2.35rem * var(--scale)); font-weight: 950; line-height: 1.15; }
    .stats-card { padding: 18px 14px; }
    .stats-title { margin: 0 0 5px; color: var(--blue); font-size: calc(1.55rem * var(--scale)); }
    .stats-note { margin: 0 0 13px; color: #66757d; font-size: calc(.82rem * var(--scale)); }
    .stats-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-box { padding: 12px 6px; border-radius: 14px; background: var(--pale); }
    .stat-box span { display: block; color: #62717a; font-size: calc(.78rem * var(--scale)); font-weight: 800; }
    .stat-box strong { display: block; margin-top: 2px; color: var(--blue); font-size: calc(2rem * var(--scale)); line-height: 1; }
    .stats-types { overflow: hidden; margin-top: 12px; border: 1px solid #ced9df; border-radius: 14px; }
    .stats-row { display: grid; grid-template-columns: 1.3fr .72fr .72fr 1.08fr; align-items: center; width: 100%; min-height: 52px; padding: 8px 10px; border: 0; border-top: 1px solid #dfe7eb; color: var(--ink); background: #fff; font-size: calc(.96rem * var(--scale)); font-weight: 850; text-align: center; }
    .stats-row:first-child { border-top: 0; }
    .stats-row strong { color: var(--blue); font-size: calc(1.12rem * var(--scale)); text-align: left; }
    .stats-row-button { cursor: pointer; }
    .stats-row-button:active { background: var(--pale); }
    .analysis-button, .analysis-back { width: 100%; min-height: 48px; margin-top: 10px; border: 1px solid var(--blue); border-radius: 13px; color: #fff; background: var(--blue); font-size: calc(1.08rem * var(--scale)); font-weight: 950; }
    .analysis-back { color: var(--blue); background: #fff; }
    .analysis-filters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 12px 0; }
    .analysis-filter { min-height: 42px; border: 1px solid #aebbc3; border-radius: 12px; color: var(--blue); background: #fff; font-size: calc(.96rem * var(--scale)); font-weight: 900; }
    .analysis-filter.active { color: #fff; border-color: var(--blue); background: var(--blue); }
    .analysis-empty { padding: 26px 12px; border-radius: 14px; color: #687781; background: #f4f7f8; font-size: calc(1rem * var(--scale)); line-height: 1.55; }
    .error-ranking { overflow: hidden; border: 1px solid #ced9df; border-radius: 14px; }
    .error-rank-item { display: grid; grid-template-columns: 2.1rem 4.1rem 1fr auto; align-items: center; gap: 7px; width: 100%; min-height: 76px; padding: 8px; border: 0; border-top: 1px solid #dfe7eb; color: var(--ink); background: #fff; text-align: left; }
    .error-rank-item:first-child { border-top: 0; }
    .error-rank-item .picker-hex { width: 56px; gap: 3px; }
    .error-rank-item .picker-hex .yao { height: 5px; gap: 6px; }
    .rank-number { color: #7a878e; font-weight: 900; }
    .rank-name { display: block; color: var(--blue); font-size: calc(1.28rem * var(--scale)); font-weight: 950; }
    .rank-meta { display: block; margin-top: 2px; color: #697780; font-size: calc(.72rem * var(--scale)); }
    .rank-errors { color: #b52d2d; font-size: calc(1.02rem * var(--scale)); font-weight: 950; white-space: nowrap; }
    .detail-hex { margin: 8px auto 5px; }
    .detail-name { margin: 4px 0 8px; color: var(--blue); font-size: calc(2rem * var(--scale)); }
    .detail-breakdown { overflow: hidden; margin-top: 12px; border: 1px solid #ced9df; border-radius: 14px; }
    .detail-type { display: grid; grid-template-columns: 1.25fr .8fr .8fr 1fr; width: 100%; min-height: 50px; align-items: center; padding: 7px 9px; border: 0; border-top: 1px solid #dfe7eb; color: var(--ink); background: #fff; font-size: calc(.9rem * var(--scale)); font-weight: 850; }
    .detail-type:first-child { border-top: 0; }
    .detail-type.active { background: var(--pale); }
    .detail-type strong { color: var(--blue); text-align: left; }
    .patterns-title { margin: 14px 0 7px; color: var(--blue); font-size: calc(1.15rem * var(--scale)); }
    .error-pattern { padding: 10px; border-top: 1px solid #dfe7eb; font-size: calc(.9rem * var(--scale)); line-height: 1.35; text-align: left; }
    .error-pattern:first-child { border-top: 0; }
    .error-pattern strong { color: #b52d2d; }
    .clear-stats { width: 100%; min-height: 48px; margin-top: 12px; border: 1px solid #b52d2d; border-radius: 13px; color: #b52d2d; background: #fff; font-size: calc(1.08rem * var(--scale)); font-weight: 950; }
    .clear-stats.confirm { color: #fff; background: #b52d2d; }
    #flash-screen { padding-bottom: 40vh; touch-action: pan-y; }
    @media (max-width: 370px) {
      .shell { padding-left: 7px; padding-right: 7px; }
      .control { font-size: calc(1.1rem * var(--scale)); }
      .line-row { grid-template-columns: minmax(4.1rem, .8fr) minmax(7.5rem, 1.35fr) minmax(4.1rem, .8fr); padding-inline: 6px; font-size: calc(1.06rem * var(--scale)); }
      .answer-yao { gap: 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>六十四卦・六親持世</h1>
      <p class="subtitle">四階段：八宮 → 幾世 → 五行六親 → 六親持世</p>
    </header>
    <nav class="controls" aria-label="學習工具">
      <div class="control-row two">
        <button class="control" data-mode="picker">選卦學習</button>
        <button class="control" data-mode="stats">學習紀錄</button>
      </div>
      <p class="training-label">依照順序逐關練習</p>
      <div class="control-row four">
        <button class="control stage-control active" data-mode="palace">① 八宮</button>
        <button class="control stage-control" data-mode="generation">② 幾世卦</button>
        <button class="control stage-control" data-mode="coordinate">③ 五行六親</button>
        <button class="control stage-control" data-mode="flash">④ 六親持世</button>
      </div>
      <div class="control-row three">
        <button class="control" id="smaller" aria-label="縮小文字">A−</button>
        <button class="control" id="normal">A 標準</button>
        <button class="control" id="larger" aria-label="放大文字">A＋</button>
      </div>
    </nav>
    <section id="picker-screen" class="screen"></section>
    <section id="study-screen" class="screen" hidden></section>
    <section id="flash-screen" class="screen" hidden></section>
    <section id="stats-screen" class="screen" hidden></section>
  </main>
  <script>
    const names = ['乾','坤','屯','蒙','需','訟','師','比','小畜','履','泰','否','同人','大有','謙','豫','隨','蠱','臨','觀','噬嗑','賁','剝','復','無妄','大畜','頤','大過','坎','離','咸','恆','遯','大壯','晉','明夷','家人','睽','蹇','解','損','益','夬','姤','萃','升','困','井','革','鼎','震','艮','漸','歸妹','豐','旅','巽','兌','渙','節','中孚','小過','既濟','未濟'];
    const bitsByKingWen = [63,0,17,34,23,58,2,16,55,59,7,56,61,47,4,8,25,38,3,48,41,37,32,1,57,39,33,30,18,45,28,14,60,15,40,5,53,43,20,10,35,49,31,62,24,6,26,22,29,46,9,36,52,11,13,44,54,27,50,19,51,12,21,42];
    const palaces = [{t:7,e:'金',n:'乾'},{t:3,e:'金',n:'兌'},{t:5,e:'火',n:'離'},{t:1,e:'木',n:'震'},{t:6,e:'木',n:'巽'},{t:2,e:'水',n:'坎'},{t:4,e:'土',n:'艮'},{t:0,e:'土',n:'坤'}];
    const masks = [0,1,3,7,15,31,23,16];
    const worlds = [6,1,2,3,4,5,4,3];
    const responses = [3,4,5,6,1,2,1,6];
    const generations = ['本宮卦','一世卦','二世卦','三世卦','四世卦','五世卦','遊魂卦','歸魂卦'];
    const generationChoices = ['本','1','2','3','4','5','遊魂','歸魂'];
    const palaceChoices = ['乾','兌','離','震','巽','坎','艮','坤'];
    const kinChoices = ['父母','兄弟','子孫','妻財','官鬼'];
    const najia = {
      7:{i:['甲子','甲寅','甲辰'],o:['壬午','壬申','壬戌']},0:{i:['乙未','乙巳','乙卯'],o:['癸丑','癸亥','癸酉']},
      1:{i:['庚子','庚寅','庚辰'],o:['庚午','庚申','庚戌']},6:{i:['辛丑','辛亥','辛酉'],o:['辛未','辛巳','辛卯']},
      2:{i:['戊寅','戊辰','戊午'],o:['戊申','戊戌','戊子']},5:{i:['己卯','己丑','己亥'],o:['己酉','己未','己巳']},
      4:{i:['丙辰','丙午','丙申'],o:['丙戌','丙子','丙寅']},3:{i:['丁巳','丁卯','丁丑'],o:['丁亥','丁酉','丁未']}
    };
    const branchElement = {子:'水',亥:'水',寅:'木',卯:'木',巳:'火',午:'火',申:'金',酉:'金',辰:'土',戌:'土',丑:'土',未:'土'};
    const generates = {木:'火',火:'土',土:'金',金:'水',水:'木'};
    const controls = {木:'土',土:'水',水:'火',火:'金',金:'木'};
    function sixKin(palace,line) { if(palace===line)return'兄弟'; if(generates[line]===palace)return'父母'; if(generates[palace]===line)return'子孫'; if(controls[line]===palace)return'官鬼'; return'妻財'; }
    const palaceByBits = new Map();
    palaces.forEach(p => masks.forEach((mask,i) => palaceByBits.set((p.t|(p.t<<3))^mask,{element:p.e,palace:p.n,generation:generations[i],generationChoice:generationChoices[i],world:worlds[i],response:responses[i]})));
    const records = names.map((name,index) => {
      const bits=bitsByKingWen[index], palace=palaceByBits.get(bits), lower=bits&7, upper=(bits>>3)&7;
      const assignments=[...najia[lower].i,...najia[upper].o];
      const lines=assignments.map((stemBranch,i)=>{const element=branchElement[stemBranch.slice(-1)];return{line:i+1,stemBranch,element,kin:sixKin(palace.element,element)};});
      return{index,name,bits,...palace,lines,holding:lines[palace.world-1].kin};
    });
    if(records.length!==64||palaceByBits.size!==64)throw new Error('六十四卦資料不完整');

    const pickerScreen=document.getElementById('picker-screen'),studyScreen=document.getElementById('study-screen'),flashScreen=document.getElementById('flash-screen'),statsScreen=document.getElementById('stats-screen');
    const screens=[pickerScreen,studyScreen,flashScreen,statsScreen],scales=[.88,1,1.16],STATS_KEY='najia-memory-stats-v1';
    let scaleIndex=2,currentIndex=0,currentMode='picker',flashType='holding',pickerOrder='kingwen',deck=[],deckPosition=0,touchX=null,touchY=null,clearPending=false;
    const TYPE_LABELS={palace:'八宮',generation:'幾世卦',coordinate:'五行六親',holding:'六親持世'};
    const TRAINING_TYPES=['palace','generation','coordinate','holding'];
    function emptyStats(){return{total:0,correct:0,byType:{palace:{total:0,correct:0},generation:{total:0,correct:0},coordinate:{total:0,correct:0},holding:{total:0,correct:0}},history:[]}}
    function loadStats(){try{const saved=JSON.parse(localStorage.getItem(STATS_KEY));if(saved&&saved.byType?.holding&&saved.byType?.generation&&saved.byType?.palace){saved.byType.coordinate=saved.byType.coordinate||{total:0,correct:0};saved.history=(Array.isArray(saved.history)?saved.history:[]).map(event=>event.type==='generation'?{...event,choice:event.choice==='6'?'本':event.choice,correct:event.correct==='6'?'本':event.correct}:event);return saved}}catch(_){}return emptyStats()}
    let stats=loadStats();
    function saveStats(){try{localStorage.setItem(STATS_KEY,JSON.stringify(stats))}catch(_){}}
    function rate(item){return item.total?Math.round(item.correct/item.total*100):0}
    function errorRate(item){return item.total?100-rate(item):0}
    function recordAnswer(r,choice,correct,isCorrect){const bucket=stats.byType[flashType];stats.total++;bucket.total++;if(isCorrect){stats.correct++;bucket.correct++}stats.history.push({hex:r.index,type:flashType,choice,correct,ok:isCorrect,at:Date.now()});if(stats.history.length>2000)stats.history=stats.history.slice(-2000);saveStats()}
    function statsRow(type,item){return`<button class="stats-row stats-row-button" onclick="showErrorRanking('${type}')"><strong>${TYPE_LABELS[type]}</strong><span>${item.total}次</span><span>錯${item.total-item.correct}</span><span>${errorRate(item)}% ›</span></button>`}
    function showStats(){currentMode='stats';clearPending=false;hideScreens();statsScreen.hidden=false;setActive('stats');const wrong=stats.total-stats.correct,legacy=Math.max(0,stats.total-stats.history.length);statsScreen.innerHTML=`<article class="card stats-card"><h2 class="stats-title">學習紀錄</h2><p class="stats-note">紀錄只保存在這支手機的 Safari，不會上傳。${legacy?`舊紀錄 ${legacy} 次沒有單卦明細。`:''}</p><div class="stats-summary"><div class="stat-box"><span>回答次數</span><strong>${stats.total}</strong></div><div class="stat-box"><span>正確率</span><strong>${rate(stats)}%</strong></div><div class="stat-box"><span>錯誤率</span><strong>${errorRate(stats)}%</strong></div><div class="stat-box"><span>答錯</span><strong>${wrong}</strong></div></div><div class="stats-types">${TRAINING_TYPES.map(type=>statsRow(type,stats.byType[type])).join('')}</div><button class="analysis-button" onclick="showErrorRanking('all')">查看錯題排行 →</button><button class="clear-stats" id="clear-stats">清除全部紀錄</button></article>`;document.getElementById('clear-stats').onclick=clearStats;alignCard(statsScreen)}
    function analysisFilters(active){return`<div class="analysis-filters">${[['all','全部'],...TRAINING_TYPES.map(type=>[type,TYPE_LABELS[type]])].map(([key,label])=>`<button class="analysis-filter ${active===key?'active':''}" onclick="showErrorRanking('${key}')">${label}</button>`).join('')}</div>`}
    function showErrorRanking(type='all'){currentMode='stats';hideScreens();statsScreen.hidden=false;setActive('stats');const errors=stats.history.filter(x=>!x.ok&&(type==='all'||x.type===type)),groups=new Map();errors.forEach(x=>{const g=groups.get(x.hex)||{hex:x.hex,count:0,types:{}};g.count++;g.types[x.type]=(g.types[x.type]||0)+1;groups.set(x.hex,g)});const ranked=[...groups.values()].sort((a,b)=>b.count-a.count||a.hex-b.hex),rows=ranked.map((g,i)=>{const r=records[g.hex],meta=Object.entries(g.types).map(([k,v])=>`${TYPE_LABELS[k]} ${v}`).join('・');return`<button class="error-rank-item" onclick="showHexErrorDetail(${g.hex},'${type}')"><span class="rank-number">${i+1}</span>${hexMarkup(r.bits,true)}<span><strong class="rank-name">${r.name}</strong><span class="rank-meta">${meta}</span></span><span class="rank-errors">錯 ${g.count} 次 ›</span></button>`}).join('');statsScreen.innerHTML=`<article class="card stats-card"><h2 class="stats-title">錯題排行</h2><p class="stats-note">由錯誤次數最多的卦開始複習。</p>${analysisFilters(type)}${rows?`<div class="error-ranking">${rows}</div>`:`<div class="analysis-empty">這個分類目前還沒有錯題。<br>繼續練習後，錯題會自動出現在這裡。</div>`}<button class="analysis-back" onclick="showStats()">← 回學習紀錄</button></article>`;alignCard(statsScreen)}
    function showHexErrorDetail(index,type='all'){currentMode='stats';hideScreens();statsScreen.hidden=false;setActive('stats');const r=records[index],all=stats.history.filter(x=>x.hex===index),shown=all.filter(x=>type==='all'||x.type===type),wrong=shown.filter(x=>!x.ok),correct=shown.length-wrong.length,typeRows=TRAINING_TYPES.map(key=>{const items=all.filter(x=>x.type===key),bad=items.filter(x=>!x.ok).length;return`<button class="detail-type ${type===key?'active':''}" onclick="showHexErrorDetail(${index},'${key}')"><strong>${TYPE_LABELS[key]}</strong><span>${items.length}次</span><span>錯${bad}</span><span>${items.length?Math.round(bad/items.length*100):0}% ›</span></button>`}).join(''),patterns=new Map();wrong.forEach(x=>{const key=`${x.type}|${x.choice}|${x.correct}`,p=patterns.get(key)||{type:x.type,choice:x.choice,correct:x.correct,count:0};p.count++;patterns.set(key,p)});const patternRows=[...patterns.values()].sort((a,b)=>b.count-a.count).map(p=>`<div class="error-pattern"><strong>${TYPE_LABELS[p.type]}・錯 ${p.count} 次</strong><br>你選「${p.choice}」→ 正確「${p.correct}${p.type==='palace'?'宮':''}」</div>`).join('');statsScreen.innerHTML=`<article class="card stats-card"><div class="ordinal">單卦錯題分析</div><div class="detail-hex">${hexMarkup(r.bits)}</div><h2 class="detail-name">${r.name}</h2><div class="stats-summary"><div class="stat-box"><span>本分類作答</span><strong>${shown.length}</strong></div><div class="stat-box"><span>答錯</span><strong>${wrong.length}</strong></div><div class="stat-box"><span>答對</span><strong>${correct}</strong></div><div class="stat-box"><span>錯誤率</span><strong>${shown.length?Math.round(wrong.length/shown.length*100):0}%</strong></div></div><div class="detail-breakdown">${typeRows}</div><h3 class="patterns-title">最常出現的錯法</h3>${patternRows?`<div class="error-ranking">${patternRows}</div>`:`<div class="analysis-empty">這個分類沒有錯誤明細。</div>`}<button class="analysis-back" onclick="showErrorRanking('${type}')">← 回錯題排行</button><button class="analysis-back" onclick="showStats()">回學習紀錄</button></article>`;alignCard(statsScreen)}
    function clearStats(){const button=document.getElementById('clear-stats');if(!clearPending){clearPending=true;button.textContent='再按一次確認清除';button.classList.add('confirm');return}stats=emptyStats();saveStats();showStats()}
    function hideScreens(){screens.forEach(s=>s.hidden=true)}
    function setActive(mode){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
    function hexMarkup(bits,small=false){let rows='';for(let i=5;i>=0;i--){const yang=Boolean(bits&(1<<i));rows+=`<div class="yao">${yang?'<span></span>':'<span></span><span></span>'}</div>`}return`<div class="hex-lines ${small?'picker-hex':''}" aria-label="六爻卦象">${rows}</div>`}
    function lineName(i){return['初爻','二爻','三爻','四爻','五爻','上爻'][i-1]}
    function generationLabel(r){return r.generationChoice==='本'?'本卦':r.generationChoice==='遊魂'||r.generationChoice==='歸魂'?r.generationChoice:`${r.generationChoice}世`}
    function sixKinRule(palace,line){if(palace===line)return'同我者為兄弟';if(generates[line]===palace)return'生我者為父母';if(generates[palace]===line)return'我生者為子孫';if(controls[line]===palace)return'克我者為官鬼';return'我克者為妻財'}
    function tableMarkup(r){return`<div class="line-table">${[...r.lines].reverse().map(x=>{const yang=Boolean(r.bits&(1<<(x.line-1))),mark=x.line===r.world?'世':x.line===r.response?'應':'',branchElementLabel=`${x.stemBranch.slice(-1)}${x.element}`;return`<div class="line-row ${x.line===r.world?'world':x.line===r.response?'response':''}"><span class="najia">${branchElementLabel}</span><span class="line-center"><span class="answer-yao">${yang?'<span></span>':'<span></span><span></span>'}</span><span class="position">${mark}</span></span><span class="relation">${x.kin}</span></div>`}).join('')}</div>`}
    function alignCard(screen){requestAnimationFrame(()=>requestAnimationFrame(()=>{const card=screen.querySelector('.card');if(card)card.scrollIntoView({behavior:'auto',block:'start'})}))}
    function centerFlashAnswer(){requestAnimationFrame(()=>requestAnimationFrame(()=>{const answer=document.getElementById('flash-answer'),lastButton=document.getElementById('shuffle-button');if(!answer||answer.hidden||!lastButton)return;const rect=answer.getBoundingClientRect(),lastRect=lastButton.getBoundingClientRect(),groupHeight=lastRect.bottom-rect.top,safeTop=100,centerTop=Math.max(safeTop,(window.innerHeight-groupHeight)/2),target=Math.max(0,window.scrollY+rect.top-centerTop);window.scrollTo({top:target,behavior:'smooth'})}))}
    function pickerCard(r){return`<button class="picker-item" onclick="openStudy(${r.index})">${hexMarkup(r.bits,true)}<span class="picker-name">${r.name}</span><span class="picker-no">第${r.index+1}卦</span></button>`}
    function pickerGroups(){if(pickerOrder==='palace')return palaceChoices.map(palace=>({label:`${palace}宮`,items:records.filter(r=>r.palace===palace).sort((a,b)=>generationChoices.indexOf(a.generationChoice)-generationChoices.indexOf(b.generationChoice))}));if(pickerOrder==='generation')return generationChoices.map(generation=>({label:generation==='本'?'本卦':generation==='遊魂'||generation==='歸魂'?`${generation}卦`:`${generation}世卦`,items:records.filter(r=>r.generationChoice===generation).sort((a,b)=>palaceChoices.indexOf(a.palace)-palaceChoices.indexOf(b.palace))}));return[{label:'',items:records}]}
    function renderPicker(){const buttons=[['kingwen','卦序'],['palace','BY 宮'],['generation','BY 幾世卦']].map(([key,label])=>`<button class="picker-sort ${pickerOrder===key?'active':''}" data-picker-order="${key}">${label}</button>`).join(''),groups=pickerGroups().map(group=>`${group.label?`<h3 class="picker-group-title">${group.label}</h3>`:''}${group.items.map(pickerCard).join('')}`).join('');pickerScreen.innerHTML=`<h2 class="section-title">選一卦學習</h2><p class="intro">點卦象，直接查看大字六爻裝卦與六親持世。</p><div class="picker-order" aria-label="選卦排列方式">${buttons}</div><div class="picker-grid">${groups}</div>`;document.querySelectorAll('[data-picker-order]').forEach(button=>button.onclick=()=>{pickerOrder=button.dataset.pickerOrder;renderPicker()})}
    function showPicker(){currentMode='picker';hideScreens();pickerScreen.hidden=false;setActive('picker');renderPicker();window.scrollTo(0,0)}
    function openStudy(index){currentIndex=(index+64)%64;const r=records[currentIndex];currentMode='study';hideScreens();studyScreen.hidden=false;setActive('');studyScreen.innerHTML=`<article class="card"><div class="ordinal">第 ${r.index+1} 卦</div>${hexMarkup(r.bits)}<h2 class="hex-name">${r.name}</h2><div class="holding">${r.holding}持世</div>${tableMarkup(r)}<p class="hint">向右滑上一卦　·　向左滑下一卦</p><div class="nav"><button onclick="openStudy(${currentIndex-1})">← 上一卦</button><button onclick="openStudy(${currentIndex+1})">下一卦 →</button></div><button class="back-button" onclick="showPicker()">← 回選卦</button></article>`;alignCard(studyScreen)}
    function shuffle(){deck=Array.from({length:64},(_,i)=>i);for(let i=63;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}deckPosition=0}
    function showFlash(reset=false,activeMode='flash',type='holding'){flashType=type;if(reset||!deck.length)shuffle();currentMode='flash';hideScreens();flashScreen.hidden=false;setActive(activeMode);renderFlash()}
    function moveFlashCard(step=1){deckPosition=(deckPosition+step+64)%64;renderFlash()}
    function flashSwipeStep(dx,dy){if(Math.abs(dx)<=55||Math.abs(dx)<=Math.abs(dy)*1.25)return 0;return dx<0?1:-1}
    function gradeQuiz(choice){const r=records[deck[deckPosition]],isGeneration=flashType==='generation',isPalace=flashType==='palace',correct=isPalace?r.palace:isGeneration?r.generationChoice:r.holding,isCorrect=choice===correct,feedback=document.getElementById('quiz-feedback'),correctText=isPalace?`${correct}宮`:correct;document.querySelectorAll('.quiz-choice').forEach(button=>{button.disabled=true;if(button.dataset.choice===correct)button.classList.add('correct');else if(button.dataset.choice===choice)button.classList.add('wrong')});document.querySelector('.quiz-choices')?.classList.add('answered');recordAnswer(r,choice,correct,isCorrect);feedback.textContent=isCorrect?'答對了 ✓':`答錯了，正確答案是 ${correctText}`;feedback.className=`quiz-feedback ${isCorrect?'correct':'wrong'}`;document.getElementById('flash-answer').hidden=false;centerFlashAnswer()}
    function renderFlash(){
      const r=records[deck[deckPosition]],isGeneration=flashType==='generation',isPalace=flashType==='palace',isCoordinate=flashType==='coordinate';
      const stage=isPalace?1:isGeneration?2:isCoordinate?3:4;
      const worldLine=r.lines[r.world-1],worldBranchElement=`${worldLine.stemBranch.slice(-1)}${worldLine.element}`;
      const question=isGeneration?'這是幾世卦？':isPalace?'這是什麼宮？':isCoordinate?'是哪一個六親？':'哪一個六親持世？';
      const answerTitle=isGeneration?`${generationLabel(r)}・${r.palace}宮`:isPalace?`${r.palace}宮・${r.holding}持世`:`${r.holding}持世${isCoordinate?'':`・${lineName(r.world)}`}`;
      const answerNote=isCoordinate?`<div class="coordinate-note">${r.palace}宮（${r.element}）・世爻${worldBranchElement}<br>${sixKinRule(r.element,worldLine.element)}</div>`:'';
      const choices=isGeneration?generationChoices:isPalace?palaceChoices:kinChoices;
      const choiceClass=isPalace?'palace-choices':isGeneration?'':'kin-choices';
      const choiceLabel=isGeneration?'幾世卦':isPalace?'八宮':isCoordinate?'五行六親':'六親持世';
      const questionVisual=isCoordinate?`${hexMarkup(r.bits)}<div class="coordinate-prompt" aria-label="五行六親條件"><span><small>${r.palace}宮五行</small><strong>${r.element}</strong></span><span><small>世爻納甲</small><strong>${worldBranchElement}</strong></span></div>`:hexMarkup(r.bits);
      const answerHex='';
      const quizControls=`<div class="quiz-choices ${choiceClass}" aria-label="${choiceLabel}選項">${choices.map(choice=>`<button class="quiz-choice" data-choice="${choice}">${choice}</button>`).join('')}</div>`;
      flashScreen.innerHTML=`<article class="card flash-card"><div class="stage-badge">第 ${stage} 關 / 4・${TYPE_LABELS[flashType]}</div><div class="ordinal">第 ${deckPosition+1} / 64 題</div><div class="flash-question">${question}</div>${questionVisual}${quizControls}<div class="flash-answer" id="flash-answer" hidden><div class="quiz-feedback" id="quiz-feedback" aria-live="polite"></div>${answerHex}<div class="answer-name">卦名<strong>${r.name}</strong></div><div class="holding">${answerTitle}</div>${answerNote}${tableMarkup(r)}</div><div class="nav"><button id="prev-card">← 上一題</button><button id="next-card">下一題 →</button></div><button class="shuffle-button" id="shuffle-button">重新隨機開始</button></article>`;
      document.querySelectorAll('.quiz-choice').forEach(button=>button.onclick=()=>gradeQuiz(button.dataset.choice));
      document.getElementById('prev-card').onclick=()=>moveFlashCard(-1);
      document.getElementById('next-card').onclick=()=>moveFlashCard(1);
      document.getElementById('shuffle-button').onclick=()=>showFlash(true,flashType==='generation'?'generation':flashType==='palace'?'palace':flashType==='coordinate'?'coordinate':'flash',flashType);
      alignCard(flashScreen)
    }
    function updateScale(){document.documentElement.style.setProperty('--scale',scales[scaleIndex])}
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode==='picker')showPicker();else if(b.dataset.mode==='stats')showStats();else if(b.dataset.mode==='generation')showFlash(true,'generation','generation');else if(b.dataset.mode==='palace')showFlash(true,'palace','palace');else if(b.dataset.mode==='coordinate')showFlash(true,'coordinate','coordinate');else showFlash(true,'flash','holding')});
    document.getElementById('smaller').onclick=()=>{scaleIndex=Math.max(0,scaleIndex-1);updateScale()};document.getElementById('normal').onclick=()=>{scaleIndex=1;updateScale()};document.getElementById('larger').onclick=()=>{scaleIndex=Math.min(2,scaleIndex+1);updateScale()};
    studyScreen.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchX=t.clientX;touchY=t.clientY},{passive:true});studyScreen.addEventListener('touchend',e=>{if(touchX===null)return;const t=e.changedTouches[0],dx=t.clientX-touchX,dy=t.clientY-touchY;touchX=touchY=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)openStudy(currentIndex+(dx<0?1:-1))},{passive:true});
    flashScreen.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;touchX=e.clientX;touchY=e.clientY;try{flashScreen.setPointerCapture(e.pointerId)}catch(_){} });flashScreen.addEventListener('pointerup',e=>{if(!e.isPrimary||touchX===null)return;const dx=e.clientX-touchX,dy=e.clientY-touchY,step=flashSwipeStep(dx,dy);touchX=touchY=null;if(step)moveFlashCard(step)});flashScreen.addEventListener('pointercancel',()=>{touchX=touchY=null});
    updateScale();showFlash(true,'palace','palace');
  </script>
</body>
</html>
