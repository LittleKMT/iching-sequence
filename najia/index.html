<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123f61">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="六親持世">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>六十四卦・六親持世閃卡</title>
  <style>
    :root { --scale: 1; --blue: #123f61; --pale: #e9f3f8; --cream: #f6f2e9; --ink: #14202a; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--cream); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
    button { font: inherit; white-space: nowrap; }
    .shell { width: min(100%, 620px); margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 10px calc(30px + env(safe-area-inset-bottom)); }
    header { padding: 6px 4px 10px; text-align: center; }
    h1 { margin: 0; color: var(--blue); font-size: calc(1.6rem * var(--scale)); line-height: 1.2; }
    .subtitle { margin: 4px 0 0; color: #62717a; font-size: calc(.9rem * var(--scale)); }
    .controls { margin-bottom: 9px; padding: 4px 0; }
    .control-row { display: grid; gap: 6px; margin-bottom: 5px; }
    .control-row.two { grid-template-columns: 1fr 1fr; }
    .control-row.three { grid-template-columns: repeat(3, 1fr); margin-bottom: 0; }
    .control-row.four { grid-template-columns: repeat(2, 1fr); }
    .control.full { grid-column: 1 / -1; }
    .control { min-height: 46px; padding: 8px 3px; border: 1px solid #b7c3cb; border-radius: 13px; color: #1c2b35; background: #fff; font-size: calc(1.22rem * var(--scale)); font-weight: 950; line-height: 1; }
    .control.active { color: #fff; border-color: var(--blue); background: var(--blue); }
    .training-label { margin: 7px 0 6px; color: var(--blue); font-size: calc(.94rem * var(--scale)); font-weight: 950; text-align: left; }
    .stage-control { min-height: 54px; }
    .screen[hidden] { display: none !important; }
    .section-title { margin: 14px 0 5px; color: var(--blue); font-size: calc(1.35rem * var(--scale)); }
    .intro { margin: 0 0 10px; color: #60707a; font-size: calc(.95rem * var(--scale)); line-height: 1.45; }
    .picker-order { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 11px; }
    .picker-sort { min-height: 43px; padding: 6px 3px; border: 1px solid #aebbc3; border-radius: 12px; color: var(--blue); background: #fff; font-size: calc(.98rem * var(--scale)); font-weight: 950; }
    .picker-sort.active { color: #fff; border-color: var(--blue); background: var(--blue); }
    .picker-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    .picker-group-title { grid-column: 1 / -1; margin: 8px 0 0; padding: 7px 10px; border-radius: 10px; color: #fff; background: var(--blue); font-size: calc(1.08rem * var(--scale)); font-weight: 950; text-align: left; }
    .picker-group-title:first-child { margin-top: 0; }
    .picker-item { min-width: 0; padding: 11px 4px 9px; border: 1px solid #c9d3d9; border-radius: 15px; color: var(--blue); background: #fff; }
    .picker-name { display: block; margin-top: 7px; font-size: calc(1.32rem * var(--scale)); font-weight: 950; }
    .picker-no { display: block; margin-top: 2px; color: #6c7a83; font-size: calc(.72rem * var(--scale)); }
    .hex-lines { display: grid; gap: 9px; width: min(76vw, 270px); margin: 0 auto; color: var(--blue); }
    .yao { display: flex; gap: 24px; height: 20px; }
    .yao span { display: block; flex: 1; border-radius: 1px; background: currentColor; }
    .picker-hex { gap: 4px; width: 76px; }
    .picker-hex .yao { gap: 8px; height: 7px; }
    .card { overflow: hidden; padding: 14px 12px; border: 1px solid #d1d5d3; border-radius: 20px; background: #fff; box-shadow: 0 5px 18px #2033250d; text-align: center; }
    .ordinal { color: #6a7880; font-size: calc(.82rem * var(--scale)); }
    .card .hex-lines { margin-top: 10px; }
    .hex-name { margin: 8px 0 5px; color: var(--blue); font-size: calc(2.15rem * var(--scale)); font-weight: 950; }
    .holding { margin: 8px 0 10px; padding: 10px 8px; border-radius: 13px; color: #fff; background: var(--blue); font-size: calc(1.65rem * var(--scale)); font-weight: 950; }
    .line-table { overflow: hidden; margin-top: 8px; border: 1px solid #ced9df; border-radius: 14px; text-align: left; }
    .line-row { display: grid; grid-template-columns: minmax(4.6rem, .85fr) minmax(8.4rem, 1.35fr) minmax(4.6rem, .85fr); align-items: center; min-height: 70px; padding: 8px 10px; border-top: 1px solid #dfe7eb; font-size: calc(1.16rem * var(--scale)); }
    .line-row:first-child { border-top: 0; }
    .line-row.world { background: var(--pale); }
    .najia { justify-self: start; font-weight: 950; letter-spacing: .04em; }
    .relation { justify-self: end; color: var(--blue); font-weight: 950; }
    .line-center { display: grid; grid-template-rows: 18px 1.35rem; align-items: center; gap: 4px; }
    .answer-yao { display: flex; gap: 18px; height: 16px; }
    .answer-yao span { display: block; flex: 1; background: #111; }
    .position { min-height: 1.35rem; color: #6a7880; text-align: center; font-size: calc(.96rem * var(--scale)); font-weight: 950; line-height: 1.2; }
    .line-row.world .position { color: #c22626; }
    .line-row.response .position { color: #1768a5; }
    .hint { margin: 9px 0 0; color: #66757d; font-size: calc(.84rem * var(--scale)); font-weight: 750; }
    .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
    .nav button, .answer-button, .back-button, .shuffle-button, .boost-button { min-height: 48px; border: 1px solid #abbac3; border-radius: 13px; color: var(--blue); background: #fff; font-size: calc(1.28rem * var(--scale)); font-weight: 950; line-height: 1; }
    .back-button, .shuffle-button { width: 100%; margin-top: 9px; color: #fff; border-color: var(--blue); background: var(--blue); }
    .memory-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
    .memory-actions .shuffle-button, .memory-actions .boost-button { width: 100%; margin-top: 0; padding-inline: 4px; font-size: calc(1.08rem * var(--scale)); }
    .boost-button { border: 2px solid var(--blue); background: #fff; }
    .boost-button.active { color: #fff; border-color: #19733e; background: #19733e; }
    .flash-question { margin: 8px 0 10px; font-size: calc(1.32rem * var(--scale)); font-weight: 950; }
    .flash-card > .hex-lines { gap: 10px; width: min(84vw, 315px); margin-top: 0; }
    .flash-card > .hex-lines .yao { gap: 27px; height: 25px; }
    .flash-card .flash-question { margin: 8px 0 7px; font-size: calc(1.68rem * var(--scale)); line-height: 1.2; }
    .stage-badge { display: inline-block; margin-bottom: 4px; padding: 5px 10px; border-radius: 999px; color: #fff; background: var(--blue); font-size: calc(.82rem * var(--scale)); font-weight: 950; }
    .coordinate-note { margin: -2px 0 7px; color: #61727d; font-size: calc(.9rem * var(--scale)); font-weight: 900; line-height: 1.3; }
    .answer-button { padding: 8px 22px; }
    .quiz-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 10px 0 4px; }
    .quiz-choices.answered { display: none; }
    .quiz-choice { min-height: 48px; border: 2px solid #aebbc3; border-radius: 13px; color: var(--blue); background: #fff; font-size: calc(1.5rem * var(--scale)); font-weight: 950; line-height: 1; }
    .quiz-choice.correct { color: #fff; border-color: #19733e; background: #19733e; }
    .quiz-choice.wrong { color: #fff; border-color: #b52d2d; background: #b52d2d; }
    .quiz-choice:disabled { opacity: 1; }
    .palace-choices .quiz-choice { min-height: 58px; font-size: calc(2rem * var(--scale)); }
    .kin-choices { grid-template-columns: repeat(3, 1fr); }
    .kin-choices .quiz-choice { min-height: 56px; font-size: calc(1.72rem * var(--scale)); }
    .quiz-feedback { min-height: 1.8rem; margin: 7px 0 2px; font-size: calc(1.12rem * var(--scale)); font-weight: 950; }
    .quiz-feedback.correct { color: #19733e; }
    .quiz-feedback.wrong { color: #b52d2d; }
    .flash-answer[hidden] { display: none; }
    .flash-answer { margin-top: 10px; }
    .flash-answer .holding { margin: 5px 0 6px; padding-block: 7px; }
    .flash-answer .line-row { min-height: 46px; padding-block: 1px; font-size: calc(1.5rem * var(--scale)); }
    .flash-answer .najia, .flash-answer .relation { line-height: 1; }
    .flash-answer .line-center { grid-template-rows: 17px calc(1.3rem * var(--scale)); gap: 0; }
    .flash-answer .position { min-height: calc(1.3rem * var(--scale)); font-size: calc(1.25rem * var(--scale)); line-height: 1; }
    .flash-card > .nav { margin-top: 5px; }
    .flash-card > .memory-actions { margin-top: 5px; }
    .answer-name { margin: 0 0 7px; color: #687781; font-size: calc(.82rem * var(--scale)); font-weight: 850; }
    .answer-name strong { display: block; margin-top: 1px; color: var(--blue); font-size: calc(2.35rem * var(--scale)); font-weight: 950; line-height: 1.15; }
    .stats-card { padding: 18px 14px; }
    .stats-title { margin: 0 0 5px; color: var(--blue); font-size: calc(1.55rem * var(--scale)); }
    .stats-note { margin: 0 0 13px; color: #66757d; font-size: calc(.82rem * var(--scale)); }
    .stats-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-box { padding: 12px 6px; border-radius: 14px; background: var(--pale); }
    .stat-box span { display: block; color: #62717a; font-size: calc(.78rem * var(--scale)); font-weight: 800; }
    .stat-box strong { display: block; margin-top: 2px; color: var(--blue); font-size: calc(2rem * var(--scale)); line-height: 1; }
    .stats-types { overflow: hidden; margin-top: 12px; border: 1px solid #ced9df; border-radius: 14px; }
    .stats-row { display: grid; grid-template-columns: 1.3fr .72fr .72fr 1.08fr; align-items: center; width: 100%; min-height: 52px; padding: 8px 10px; border: 0; border-top: 1px solid #dfe7eb; color: var(--ink); background: #fff; font-size: calc(.96rem * var(--scale)); font-weight: 850; text-align: center; }
    .stats-row:first-child { border-top: 0; }
    .stats-row strong { color: var(--blue); font-size: calc(1.12rem * var(--scale)); text-align: left; }
    .stats-row-button { cursor: pointer; }
    .stats-row-button:active { background: var(--pale); }
    .analysis-button, .analysis-back { width: 100%; min-height: 48px; margin-top: 10px; border: 1px solid var(--blue); border-radius: 13px; color: #fff; background: var(--blue); font-size: calc(1.08rem * var(--scale)); font-weight: 950; }
    .analysis-back { color: var(--blue); background: #fff; }
    .analysis-filters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 12px 0; }
    .analysis-filter { min-height: 42px; border: 1px solid #aebbc3; border-radius: 12px; color: var(--blue); background: #fff; font-size: calc(.96rem * var(--scale)); font-weight: 900; }
    .analysis-filter.active { color: #fff; border-color: var(--blue); background: var(--blue); }
    .analysis-empty { padding: 26px 12px; border-radius: 14px; color: #687781; background: #f4f7f8; font-size: calc(1rem * var(--scale)); line-height: 1.55; }
    .error-ranking { overflow: hidden; border: 1px solid #ced9df; border-radius: 14px; }
    .error-rank-item { display: grid; grid-template-columns: 2.1rem 4.1rem 1fr auto; align-items: center; gap: 7px; width: 100%; min-height: 76px; padding: 8px; border: 0; border-top: 1px solid #dfe7eb; color: var(--ink); background: #fff; text-align: left; }
    .error-rank-item:first-child { border-top: 0; }
    .error-rank-item .picker-hex { width: 56px; gap: 3px; }
    .error-rank-item .picker-hex .yao { height: 5px; gap: 6px; }
    .rank-number { color: #7a878e; font-weight: 900; }
    .rank-name { display: block; color: var(--blue); font-size: calc(1.28rem * var(--scale)); font-weight: 950; }
    .rank-meta { display: block; margin-top: 2px; color: #697780; font-size: calc(.72rem * var(--scale)); }
    .rank-errors { color: #b52d2d; font-size: calc(1.02rem * var(--scale)); font-weight: 950; white-space: nowrap; }
    .detail-hex { margin: 8px auto 5px; }
    .detail-name { margin: 4px 0 8px; color: var(--blue); font-size: calc(2rem * var(--scale)); }
    .detail-breakdown { overflow: hidden; margin-top: 12px; border: 1px solid #ced9df; border-radius: 14px; }
    .detail-type { display: grid; grid-template-columns: 1.25fr .8fr .8fr 1fr; width: 100%; min-height: 50px; align-items: center; padding: 7px 9px; border: 0; border-top: 1px solid #dfe7eb; color: var(--ink); background: #fff; font-size: calc(.9rem * var(--scale)); font-weight: 850; }
    .detail-type:first-child { border-top: 0; }
    .detail-type.active { background: var(--pale); }
    .detail-type strong { color: var(--blue); text-align: left; }
    .patterns-title { margin: 14px 0 7px; color: var(--blue); font-size: calc(1.15rem * var(--scale)); }
    .error-pattern { padding: 10px; border-top: 1px solid #dfe7eb; font-size: calc(.9rem * var(--scale)); line-height: 1.35; text-align: left; }
    .error-pattern:first-child { border-top: 0; }
    .error-pattern strong { color: #b52d2d; }
    .clear-stats { width: 100%; min-height: 48px; margin-top: 12px; border: 1px solid #b52d2d; border-radius: 13px; color: #b52d2d; background: #fff; font-size: calc(1.08rem * var(--scale)); font-weight: 950; }
    .clear-stats.confirm { color: #fff; background: #b52d2d; }
    .speed-launch { color: #fff; border-color: #b56f0b; background: linear-gradient(135deg, #d88c16, #a94f0c); }
    .speed-card { padding: 14px 12px 12px; }
    .speed-home-icon { margin: 3px 0; font-size: calc(3.2rem * var(--scale)); line-height: 1; }
    .speed-title { margin: 3px 0 5px; color: var(--blue); font-size: calc(1.75rem * var(--scale)); }
    .speed-rules { margin: 0 auto 10px; color: #62717a; font-size: calc(.96rem * var(--scale)); font-weight: 750; line-height: 1.45; }
    .speed-best { margin: 7px 0 11px; padding: 9px; border-radius: 12px; color: #8a4d00; background: #fff3d8; font-size: calc(1rem * var(--scale)); font-weight: 950; }
    .speed-start, .speed-weak, .speed-restart { width: 100%; min-height: 52px; border: 0; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #d88c16, #a94f0c); font-size: calc(1.14rem * var(--scale)); font-weight: 950; }
    .speed-home-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .speed-stage-label { margin: 11px 0 6px; color: var(--blue); font-size: calc(1rem * var(--scale)); font-weight: 950; text-align: left; }
    .match-start { width: 100%; min-height: 56px; border: 0; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #19733e, #0d5530); font-size: calc(1.2rem * var(--scale)); font-weight: 950; }
    .match-label { margin: 4px auto 9px; color: var(--blue); font-size: calc(3.2rem * var(--scale)); font-weight: 950; line-height: 1; }
    .match-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .match-choice { min-height: 64px; border: 2px solid #aebbc3; border-radius: 14px; color: var(--blue); background: #fff; font-size: calc(1.5rem * var(--scale)); font-weight: 950; }
    .match-choice.correct { color: #fff; border-color: #19733e; background: #19733e; }
    .match-choice.wrong { color: #fff; border-color: #b52d2d; background: #b52d2d; }
    .match-choice:disabled { opacity: 1; }
    .match-goal { margin: 3px 0 5px; color: #7b6600; font-size: calc(.86rem * var(--scale)); font-weight: 900; }
    .hunter-start { width: 100%; min-height: 56px; border: 0; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #6c3f9e, #432065); font-size: calc(1.2rem * var(--scale)); font-weight: 950; }
    .hunter-top { display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; gap: 5px; color: #63727b; font-size: calc(.84rem * var(--scale)); font-weight: 900; }
    .hunter-top strong { display: block; color: #5b2d82; font-size: calc(1.25rem * var(--scale)); line-height: 1.05; }
    .hunter-prompt { margin: 7px 0 8px; color: var(--ink); font-size: calc(1.15rem * var(--scale)); font-weight: 900; }
    .hunter-prompt strong { display: inline-block; margin-left: 4px; color: #5b2d82; font-size: calc(2.35rem * var(--scale)); line-height: 1; vertical-align: middle; }
    .hunter-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .hunter-cell { min-width: 0; min-height: 78px; padding: 9px 6px; border: 2px solid #c2bacb; border-radius: 12px; color: var(--blue); background: #fff; transition: transform .12s ease, background .12s ease; }
    .hunter-cell:active { transform: scale(.94); }
    .hunter-cell.correct { color: #fff; border-color: #19733e; background: #19733e; }
    .hunter-cell.wrong { color: #fff; border-color: #b52d2d; background: #b52d2d; }
    .hunter-trigram { display: grid; gap: 7px; width: 100%; margin: 0 auto; color: currentColor; }
    .hunter-trigram .yao { gap: 7px; height: 10px; }
    .hunter-feedback { min-height: calc(1.5rem * var(--scale)); margin: 6px 0 3px; color: #5b2d82; font-size: calc(1rem * var(--scale)); font-weight: 950; }
    .speed-weak { background: var(--blue); }
    .speed-weak:disabled { color: #78868e; background: #dfe5e8; }
    .speed-weak-summary { margin: 7px 0 10px; padding: 9px 8px; border-radius: 12px; color: var(--blue); background: var(--pale); font-size: calc(.88rem * var(--scale)); font-weight: 850; line-height: 1.45; }
    .speed-weak-summary strong { display: block; margin-bottom: 2px; font-size: calc(1rem * var(--scale)); }
    .speed-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; align-items: center; color: #63727b; font-size: calc(.82rem * var(--scale)); font-weight: 900; }
    .speed-top strong { color: var(--blue); }
    .speed-progress { overflow: hidden; height: 7px; margin: 7px 0 6px; border-radius: 999px; background: #dfe8ed; }
    .speed-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #e19a27, #c96112); transition: width .2s ease; }
    .speed-question { margin: 5px 0 7px; color: var(--ink); font-size: calc(1.55rem * var(--scale)); font-weight: 950; }
    .trigram-lines { display: grid; gap: 15px; width: min(84vw, 315px); margin: 0 auto 10px; color: var(--blue); }
    .trigram-lines .yao { gap: 28px; height: 30px; }
    .speed-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .speed-choice { min-height: 58px; border: 2px solid #aebbc3; border-radius: 13px; color: var(--blue); background: #fff; font-size: calc(1.85rem * var(--scale)); font-weight: 950; line-height: 1; }
    .speed-choice.correct { color: #fff; border-color: #19733e; background: #19733e; }
    .speed-choice.wrong { color: #fff; border-color: #b52d2d; background: #b52d2d; }
    .speed-choice:disabled { opacity: 1; }
    .speed-feedback { min-height: calc(1.7rem * var(--scale)); margin: 7px 0 5px; font-size: calc(1.08rem * var(--scale)); font-weight: 950; }
    .speed-feedback.correct { color: #19733e; }
    .speed-feedback.wrong { color: #b52d2d; }
    .countdown { display: grid; min-height: 390px; place-items: center; color: #c96112; font-size: calc(7rem * var(--scale)); font-weight: 950; }
    .speed-result { margin: 7px 0; color: var(--blue); font-size: calc(2rem * var(--scale)); font-weight: 950; }
    .speed-score { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 11px 0; }
    .speed-score div { padding: 11px 5px; border-radius: 13px; background: var(--pale); }
    .speed-score span { display: block; color: #66757d; font-size: calc(.78rem * var(--scale)); font-weight: 850; }
    .speed-score strong { display: block; margin-top: 3px; color: var(--blue); font-size: calc(1.65rem * var(--scale)); }
    #flash-screen { padding-bottom: 40vh; touch-action: pan-y; }
    #trigram-screen { padding-bottom: 32vh; }
    @media (max-width: 370px) {
      .shell { padding-left: 7px; padding-right: 7px; }
      .control { font-size: calc(1.1rem * var(--scale)); }
      .line-row { grid-template-columns: minmax(4.1rem, .8fr) minmax(7.5rem, 1.35fr) minmax(4.1rem, .8fr); padding-inline: 6px; font-size: calc(1.06rem * var(--scale)); }
      .answer-yao { gap: 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>六十四卦・六親持世</h1>
      <p class="subtitle">四階段：八宮 → 幾世 → 世爻五行 → 六親持世</p>
    </header>
    <nav class="controls" aria-label="學習工具">
      <div class="control-row two">
        <button class="control" data-mode="picker">選卦學習</button>
        <button class="control" data-mode="stats">學習紀錄</button>
      </div>
      <div class="control-row two">
        <button class="control speed-launch full" data-mode="trigram">⚡ 八卦快閃・速度挑戰</button>
      </div>
      <p class="training-label">依照順序逐關練習</p>
      <div class="control-row four">
        <button class="control stage-control active" data-mode="palace">① 八宮</button>
        <button class="control stage-control" data-mode="generation">② 幾世卦</button>
        <button class="control stage-control" data-mode="worldElement">③ 世爻五行</button>

  <script>
    const names = ['乾','坤','屯','蒙','需','訟','師','比','小畜','履','泰','否','同人','大有','謙','豫','隨','蠱','臨','觀','噬嗑','賁','剝','復','無妄','大畜','頤','大過','坎','離','咸','恆','遯','大壯','晉','明夷','家人','睽','蹇','解','損','益','夬','姤','萃','升','困','井','革','鼎','震','艮','漸','歸妹','豐','旅','巽','兌','渙','節','中孚','小過','既濟','未濟'];
    const bitsByKingWen = [63,0,17,34,23,58,2,16,55,59,7,56,61,47,4,8,25,38,3,48,41,37,32,1,57,39,33,30,18,45,28,14,60,15,40,5,53,43,20,10,35,49,31,62,24,6,26,22,29,46,9,36,52,11,13,44,54,27,50,19,51,12,21,42];

    const kinChoices = ['父母','兄弟','子孫','妻財','官鬼'];
    const najia = {
      7:{i:['甲子','甲寅','甲辰'],o:['壬午','壬申','壬戌']},0:{i:['乙未','乙巳','乙卯'],o:['癸丑','癸亥','癸酉']},
      1:{i:['庚子','庚寅','庚辰'],o:['庚午','庚申','庚戌']},6:{i:['辛丑','辛亥','辛酉'],o:['辛未','辛巳','辛卯']},
      2:{i:['戊寅','戊辰','戊午'],o:['戊申','戊戌','戊子']},5:{i:['己卯','己丑','己亥'],o:['己酉','己未','己巳']},
      4:{i:['丙辰','丙午','丙申'],o:['丙戌','丙子','丙寅']},3:{i:['丁巳','丁卯','丁丑'],o:['丁亥','丁酉','丁未']}
    };
    const branchElement = {子:'水',亥:'水',寅:'木',卯:'木',巳:'火',午:'火',申:'金',酉:'金',辰:'土',戌:'土',丑:'土',未:'土'};
    const generates = {木:'火',火:'土',土:'金',金:'水',水:'木'};
    const controls = {木:'土',土:'水',水:'火',火:'金',金:'木'};
    function sixKin(palace,line) { if(palace===line)return'兄弟'; if(generates[line]===palace)return'父母'; if(generates[palace]===line)return'子孫'; if(controls[line]===palace)return'官鬼'; return'妻財'; }
    const palaceByBits = new Map();
    palaces.forEach(p => masks.forEach((mask,i) => palaceByBits.set((p.t|(p.t<<3))^mask,{element:p.e,palace:p.n,generation:generations[i],generationChoice:generationChoices[i],world:worlds[i],response:responses[i]})));
    const records = names.map((name,index) => {
      const bits=bitsByKingWen[index], palace=palaceByBits.get(bits), lower=bits&7, upper=(bits>>3)&7;
      const assignments=[...najia[lower].i,...najia[upper].o];
      const lines=assignments.map((stemBranch,i)=>{const element=branchElement[stemBranch.slice(-1)];return{line:i+1,stemBranch,element,kin:sixKin(palace.element,element)};});

    });
    if(records.length!==64||palaceByBits.size!==64)throw new Error('六十四卦資料不完整');

    const pickerScreen=document.getElementById('picker-screen'),studyScreen=document.getElementById('study-screen'),flashScreen=document.getElementById('flash-screen'),statsScreen=document.getElementById('stats-screen'),trigramScreen=document.getElementById('trigram-screen');
    const screens=[pickerScreen,studyScreen,flashScreen,statsScreen,trigramScreen],scales=[.88,1,1.16],STATS_KEY='najia-memory-stats-v1',PROGRESS_KEY='najia-memory-progress-v1',TRIGRAM_KEY='najia-trigram-speed-v1',TRIGRAM_MATCH_KEY='najia-trigram-match-v1',TRIGRAM_HUNTER_KEY='najia-trigram-hunter-v1';
    let scaleIndex=2,currentIndex=0,currentMode='picker',flashType='holding',pickerOrder='kingwen',deck=[],deckPosition=0,touchX=null,touchY=null,clearPending=false,initialNavigationChosen=false;
    let trigramDeck=[],trigramPosition=0,trigramCorrect=0,trigramStreak=0,trigramBestStreak=0,trigramReactionTotal=0,trigramGameStart=0,trigramQuestionStart=0,trigramLocked=false,trigramTimer=null,trigramGameMode='standard',trigramFocusNames=[];
    let matchDeck=[],matchPosition=0,matchCorrect=0,matchStreak=0,matchBestStreak=0,matchTimes=[],matchQuestionStart=0,matchLocked=false;
    let hunterGrid=[],hunterTarget=0,hunterScore=0,hunterCorrect=0,hunterWrong=0,hunterStreak=0,hunterBestStreak=0,hunterEndsAt=0,hunterClock=null,hunterLocked=false;
    const TYPE_LABELS={palace:'八宮',generation:'幾世卦',coordinate:'舊五行六親',worldElement:'世爻五行',holding:'六親持世'};
    const TRAINING_TYPES=['palace','generation','worldElement','holding'];
    function emptyProgress(){return{lastType:'palace',modes:{},boosted:{}}}
    function validDeck(value){if(!Array.isArray(value)||value.length<64||value.length>192||new Set(value).size!==64||!value.every(x=>Number.isInteger(x)&&x>=0&&x<64))return false;const counts={};for(const x of value){counts[x]=(counts[x]||0)+1;if(counts[x]>3)return false}return true}
    function loadProgress(){try{const saved=JSON.parse(localStorage.getItem(PROGRESS_KEY));if(saved&&TRAINING_TYPES.includes(saved.lastType)&&saved.modes&&typeof saved.modes==='object'){saved.boosted=saved.boosted&&typeof saved.boosted==='object'?saved.boosted:{};return saved}}catch(_){}return emptyProgress()}
    let progress=loadProgress();
    function boostedFor(type){return new Set((progress.boosted?.[type]||[]).filter(x=>Number.isInteger(x)&&x>=0&&x<64))}
    function saveProgress(position=deckPosition){const size=Math.max(deck.length,1);progress.lastType=flashType;progress.modes[flashType]={deck:[...deck],position:(position+size)%size};try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress))}catch(_){}}
    function restoreProgress(type){const saved=progress.modes[type];if(!saved||!validDeck(saved.deck)||!Number.isInteger(saved.position))return false;deck=[...saved.deck];deckPosition=(saved.position+deck.length)%deck.length;return true}
    function emptyStats(){return{total:0,correct:0,byType:{palace:{total:0,correct:0},generation:{total:0,correct:0},worldElement:{total:0,correct:0},holding:{total:0,correct:0}},history:[]}}
    function loadStats(){try{const saved=JSON.parse(localStorage.getItem(STATS_KEY));if(saved&&saved.byType?.holding&&saved.byType?.generation&&saved.byType?.palace){saved.byType.worldElement=saved.byType.worldElement||{total:0,correct:0};saved.history=(Array.isArray(saved.history)?saved.history:[]).map(event=>event.type==='generation'?{...event,choice:event.choice==='6'?'本':event.choice,correct:event.correct==='6'?'本':event.correct}:event);return saved}}catch(_){}return emptyStats()}
    let stats=loadStats();
    function saveStats(){try{localStorage.setItem(STATS_KEY,JSON.stringify(stats))}catch(_){}}
    function rate(item){return item.total?Math.round(item.correct/item.total*100):0}
    function errorRate(item){return item.total?100-rate(item):0}
    function recordAnswer(r,choice,correct,isCorrect){const bucket=stats.byType[flashType]||(stats.byType[flashType]={total:0,correct:0});stats.total++;bucket.total++;if(isCorrect){stats.correct++;bucket.correct++}stats.history.push({hex:r.index,type:flashType,choice,correct,ok:isCorrect,at:Date.now()});if(stats.history.length>2000)stats.history=stats.history.slice(-2000);saveStats()}
    function statsRow(type,item){return`<button class="stats-row stats-row-button" onclick="showErrorRanking('${type}')"><strong>${TYPE_LABELS[type]}</strong><span>${item.total}次</span><span>錯${item.total-item.correct}</span><span>${errorRate(item)}% ›</span></button>`}
    function showStats(){currentMode='stats';clearPending=false;hideScreens();statsScreen.hidden=false;setActive('stats');const wrong=stats.total-stats.correct,legacy=Math.max(0,stats.total-stats.history.length),oldCoordinate=stats.byType.coordinate?.total||0;statsScreen.innerHTML=`<article class="card stats-card"><h2 class="stats-title">學習紀錄</h2><p class="stats-note">紀錄只保存在這支手機的 Safari，不會上傳。${legacy?`舊紀錄 ${legacy} 次沒有單卦明細。`:''}${oldCoordinate?`舊版五行六親 ${oldCoordinate} 次已保留，不混入新的世爻五行統計。`:''}</p><div class="stats-summary"><div class="stat-box"><span>回答次數</span><strong>${stats.total}</strong></div><div class="stat-box"><span>正確率</span><strong>${rate(stats)}%</strong></div><div class="stat-box"><span>錯誤率</span><strong>${errorRate(stats)}%</strong></div><div class="stat-box"><span>答錯</span><strong>${wrong}</strong></div></div><div class="stats-types">${TRAINING_TYPES.map(type=>statsRow(type,stats.byType[type])).join('')}</div><button class="analysis-button" onclick="showErrorRanking('all')">查看錯題排行 →</button><button class="clear-stats" id="clear-stats">清除全部紀錄</button></article>`;document.getElementById('clear-stats').onclick=clearStats;alignCard(statsScreen)}
    function analysisFilters(active){return`<div class="analysis-filters">${[['all','全部'],...TRAINING_TYPES.map(type=>[type,TYPE_LABELS[type]])].map(([key,label])=>`<button class="analysis-filter ${active===key?'active':''}" onclick="showErrorRanking('${key}')">${label}</button>`).join('')}</div>`}
    function showErrorRanking(type='all'){currentMode='stats';hideScreens();statsScreen.hidden=false;setActive('stats');const errors=stats.history.filter(x=>!x.ok&&(type==='all'||x.type===type)),groups=new Map();errors.forEach(x=>{const g=groups.get(x.hex)||{hex:x.hex,count:0,types:{}};g.count++;g.types[x.type]=(g.types[x.type]||0)+1;groups.set(x.hex,g)});const ranked=[...groups.values()].sort((a,b)=>b.count-a.count||a.hex-b.hex),rows=ranked.map((g,i)=>{const r=records[g.hex],meta=Object.entries(g.types).map(([k,v])=>`${TYPE_LABELS[k]} ${v}`).join('・');return`<button class="error-rank-item" onclick="showHexErrorDetail(${g.hex},'${type}')"><span class="rank-number">${i+1}</span>${hexMarkup(r.bits,true)}<span><strong class="rank-name">${r.name}</strong><span class="rank-meta">${meta}</span></span><span class="rank-errors">錯 ${g.count} 次 ›</span></button>`}).join('');statsScreen.innerHTML=`<article class="card stats-card"><h2 class="stats-title">錯題排行</h2><p class="stats-note">由錯誤次數最多的卦開始複習。</p>${analysisFilters(type)}${rows?`<div class="error-ranking">${rows}</div>`:`<div class="analysis-empty">這個分類目前還沒有錯題。<br>繼續練習後，錯題會自動出現在這裡。</div>`}<button class="analysis-back" onclick="showStats()">← 回學習紀錄</button></article>`;alignCard(statsScreen)}
    function showHexErrorDetail(index,type='all'){currentMode='stats';hideScreens();statsScreen.hidden=false;setActive('stats');const r=records[index],all=stats.history.filter(x=>x.hex===index),shown=all.filter(x=>type==='all'||x.type===type),wrong=shown.filter(x=>!x.ok),correct=shown.length-wrong.length,typeRows=TRAINING_TYPES.map(key=>{const items=all.filter(x=>x.type===key),bad=items.filter(x=>!x.ok).length;return`<button class="detail-type ${type===key?'active':''}" onclick="showHexErrorDetail(${index},'${key}')"><strong>${TYPE_LABELS[key]}</strong><span>${items.length}次</span><span>錯${bad}</span><span>${items.length?Math.round(bad/items.length*100):0}% ›</span></button>`}).join(''),patterns=new Map();wrong.forEach(x=>{const key=`${x.type}|${x.choice}|${x.correct}`,p=patterns.get(key)||{type:x.type,choice:x.choice,correct:x.correct,count:0};p.count++;patterns.set(key,p)});const patternRows=[...patterns.values()].sort((a,b)=>b.count-a.count).map(p=>`<div class="error-pattern"><strong>${TYPE_LABELS[p.type]}・錯 ${p.count} 次</strong><br>你選「${p.choice}」→ 正確「${p.correct}${p.type==='palace'?'宮':''}」</div>`).join('');statsScreen.innerHTML=`<article class="card stats-card"><div class="ordinal">單卦錯題分析</div><div class="detail-hex">${hexMarkup(r.bits)}</div><h2 class="detail-name">${r.name}</h2><div class="stats-summary"><div class="stat-box"><span>本分類作答</span><strong>${shown.length}</strong></div><div class="stat-box"><span>答錯</span><strong>${wrong.length}</strong></div><div class="stat-box"><span>答對</span><strong>${correct}</strong></div><div class="stat-box"><span>錯誤率</span><strong>${shown.length?Math.round(wrong.length/shown.length*100):0}%</strong></div></div><div class="detail-breakdown">${typeRows}</div><h3 class="patterns-title">最常出現的錯法</h3>${patternRows?`<div class="error-ranking">${patternRows}</div>`:`<div class="analysis-empty">這個分類沒有錯誤明細。</div>`}<button class="analysis-back" onclick="showErrorRanking('${type}')">← 回錯題排行</button><button class="analysis-back" onclick="showStats()">回學習紀錄</button></article>`;alignCard(statsScreen)}
    function clearStats(){const button=document.getElementById('clear-stats');if(!clearPending){clearPending=true;button.textContent='再按一次確認清除';button.classList.add('confirm');return}stats=emptyStats();saveStats();showStats()}
    function hideScreens(){screens.forEach(s=>s.hidden=true)}
    function setActive(mode){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
    function hexMarkup(bits,small=false){let rows='';for(let i=5;i>=0;i--){const yang=Boolean(bits&(1<<i));rows+=`<div class="yao">${yang?'<span></span>':'<span></span><span></span>'}</div>`}return`<div class="hex-lines ${small?'picker-hex':''}" aria-label="六爻卦象">${rows}</div>`}
    function trigramMarkup(bits){let rows='';for(let i=2;i>=0;i--){const yang=Boolean(bits&(1<<i));rows+=`<div class="yao">${yang?'<span></span>':'<span></span><span></span>'}</div>`}return`<div class="trigram-lines" aria-label="三爻八卦卦象">${rows}</div>`}
    function emptyTrigramDetail(){return{attempts:0,correct:0,totalMs:0,recent:[]}}
    function loadTrigramBest(){let value=null;try{value=JSON.parse(localStorage.getItem(TRIGRAM_KEY))}catch(_){}if(!value||!Number.isInteger(value.games))value={games:0,bestCorrect:0,bestAverage:0,bestTotal:0};value.weakGames=Number.isInteger(value.weakGames)?value.weakGames:0;value.byTrigram=value.byTrigram&&typeof value.byTrigram==='object'?value.byTrigram:{};palaceChoices.forEach(name=>{const old=value.byTrigram[name]||{},recent=Array.isArray(old.recent)?old.recent.filter(x=>x&&Number.isFinite(x.ms)&&typeof x.ok==='boolean').slice(-20):[];value.byTrigram[name]={attempts:Number.isInteger(old.attempts)?old.attempts:0,correct:Number.isInteger(old.correct)?old.correct:0,totalMs:Number.isFinite(old.totalMs)?old.totalMs:0,recent}});return value}
    let trigramBest=loadTrigramBest();
    function saveTrigramBest(){try{localStorage.setItem(TRIGRAM_KEY,JSON.stringify(trigramBest))}catch(_){}}
    function seconds(ms){return`${(ms/1000).toFixed(2)} 秒`}
    function stopTrigramTimer(){if(trigramTimer!==null){clearTimeout(trigramTimer);trigramTimer=null}if(hunterClock!==null){clearInterval(hunterClock);hunterClock=null}}
    function shuffledEight(){const items=Array.from({length:8},(_,i)=>i);for(let i=7;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
    function buildTrigramDeck(){return[...shuffledEight(),...shuffledEight(),...shuffledEight()]}
    function weaknessRanking(){return palaces.map((p,index)=>{const s=trigramBest.byTrigram[p.n]||emptyTrigramDetail(),recent=s.recent||[],average=recent.length?Math.round(recent.reduce((sum,x)=>sum+x.ms,0)/recent.length):(s.attempts?Math.round(s.totalMs/s.attempts):0),errorRate=s.attempts?1-s.correct/s.attempts:0;return{index,name:p.n,attempts:s.attempts,average,errorRate,score:average+errorRate*1800}}).filter(x=>x.attempts>0).sort((a,b)=>b.score-a.score||b.average-a.average)}
    function buildWeakDeck(){const focus=weaknessRanking().slice(0,4);trigramFocusNames=focus.map(x=>x.name);const items=Array.from({length:8},(_,i)=>i);focus.forEach(x=>items.push(x.index,x.index,x.index,x.index));for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
    function recordTrigramSpeed(name,elapsed,ok){const item=trigramBest.byTrigram[name]||(trigramBest.byTrigram[name]=emptyTrigramDetail()),capped=Math.min(elapsed,10000);item.attempts++;if(ok)item.correct++;item.totalMs+=capped;item.recent.push({ms:capped,ok});if(item.recent.length>20)item.recent=item.recent.slice(-20);saveTrigramBest()}
    function emptyMatchBest(){return{games:0,bestCorrect:0,bestMedian:0}}
    function loadMatchBest(){try{const saved=JSON.parse(localStorage.getItem(TRIGRAM_MATCH_KEY));if(saved&&Number.isInteger(saved.games))return{games:saved.games,bestCorrect:Number.isInteger(saved.bestCorrect)?saved.bestCorrect:0,bestMedian:Number.isFinite(saved.bestMedian)?saved.bestMedian:0}}catch(_){}return emptyMatchBest()}
    let matchBest=loadMatchBest();
    function saveMatchBest(){try{localStorage.setItem(TRIGRAM_MATCH_KEY,JSON.stringify(matchBest))}catch(_){}}
    function median(values){if(!values.length)return 0;const sorted=[...values].sort((a,b)=>a-b),middle=Math.floor(sorted.length/2);return sorted.length%2?sorted[middle]:Math.round((sorted[middle-1]+sorted[middle])/2)}
    function matchGoal(){return matchBest.bestMedian?Math.max(900,Math.min(2000,Math.round(matchBest.bestMedian/100)*100)):2000}
    function buildMatchDeck(){const result=[];for(let round=0;round<3;round++){const order=shuffledEight(),matchFlags=[true,true,true,true,false,false,false,false];for(let i=matchFlags.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[matchFlags[i],matchFlags[j]]=[matchFlags[j],matchFlags[i]]}order.forEach((index,i)=>{const actual=palaces[index],isMatch=matchFlags[i],neighbors=palaces.map((p,j)=>({p,j})).filter(x=>x.j!==index&&((actual.t^x.p.t).toString(2).match(/1/g)||[]).length===1),shown=isMatch?actual:neighbors[Math.floor(Math.random()*neighbors.length)].p;result.push({index,label:shown.n,isMatch})})}return result}
    function emptyHunterBest(){return{games:0,bestScore:0,bestAccuracy:0}}
    function loadHunterBest(){try{const saved=JSON.parse(localStorage.getItem(TRIGRAM_HUNTER_KEY));if(saved&&Number.isInteger(saved.games))return{games:saved.games,bestScore:Number.isInteger(saved.bestScore)?saved.bestScore:0,bestAccuracy:Number.isFinite(saved.bestAccuracy)?saved.bestAccuracy:0}}catch(_){}return emptyHunterBest()}
    let hunterBest=loadHunterBest();
    function saveHunterBest(){try{localStorage.setItem(TRIGRAM_HUNTER_KEY,JSON.stringify(hunterBest))}catch(_){}}
    function hunterWeightedPool(){const focus=weaknessRanking().slice(0,4).map(x=>x.index),pool=Array.from({length:8},(_,i)=>i);focus.forEach(index=>pool.push(index,index));return pool}

      const question=isGeneration?'這是幾世卦？':isPalace?'這是什麼宮？':isWorldElement?'世爻是哪個五行？':'哪一個六親持世？';
      const answerTitle=isGeneration?`${generationLabel(r)}・${r.palace}宮`:isPalace?`${r.palace}宮・${r.holding}持世`:isWorldElement?`世爻 ${worldBranchElement}・${worldLine.element}行`:`${r.holding}持世・${lineName(r.world)}`;
      const answerNote=isWorldElement?`<div class="coordinate-note">${r.palace}宮（${r.element}）→ ${generationLabel(r)}，世在${lineName(r.world)}<br>${worldBranchElement} → ${sixKinRule(r.element,worldLine.element)} → ${r.holding}持世</div>`:'';
      const choices=isGeneration?generationChoices:isPalace?palaceChoices:isWorldElement?['木','火','土','金','水']:kinChoices;
      const choiceClass=isPalace?'palace-choices':isGeneration?'':'kin-choices';
      const choiceLabel=isGeneration?'幾世卦':isPalace?'八宮':isWorldElement?'世爻五行':'六親持世';
      const questionVisual=hexMarkup(r.bits);
      const answerHex='';
      const quizControls=`<div class="quiz-choices ${choiceClass}" aria-label="${choiceLabel}選項">${choices.map(choice=>`<button class="quiz-choice" data-choice="${choice}">${choice}</button>`).join('')}</div>`;
      const isBoosted=boostedFor(flashType).has(r.index);
      flashScreen.innerHTML=`<article class="card flash-card"><div class="stage-badge">第 ${stage} 關 / 4・${TYPE_LABELS[flashType]}</div><div class="ordinal">第 ${deckPosition+1} / ${deck.length} 題</div><div class="flash-question">${question}</div>${questionVisual}${quizControls}<div class="flash-answer" id="flash-answer" hidden><div class="quiz-feedback" id="quiz-feedback" aria-live="polite"></div>${answerHex}<div class="answer-name">卦名<strong>${r.name}</strong></div><div class="holding">${answerTitle}</div>${answerNote}${tableMarkup(r)}</div><div class="nav"><button id="prev-card">← 上一題</button><button id="next-card">下一題 →</button></div><div class="memory-actions"><button class="shuffle-button" id="shuffle-button">重新隨機</button><button class="boost-button ${isBoosted?'active':''}" id="boost-button" aria-pressed="${isBoosted}">${isBoosted?'已加強 ✓':'加強記憶'}</button></div></article>`;
      document.querySelectorAll('.quiz-choice').forEach(button=>button.onclick=()=>gradeQuiz(button.dataset.choice));
      document.getElementById('prev-card').onclick=()=>moveFlashCard(-1);
      document.getElementById('next-card').onclick=()=>moveFlashCard(1);
      document.getElementById('shuffle-button').onclick=()=>showFlash(true,flashType==='generation'?'generation':flashType==='palace'?'palace':flashType==='worldElement'?'worldElement':'flash',flashType);
      document.getElementById('boost-button').onclick=toggleBoost;
      if(shouldAlign)alignCard(flashScreen)
    }
    function updateScale(){document.documentElement.style.setProperty('--scale',scales[scaleIndex])}
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{initialNavigationChosen=true;stopTrigramTimer();if(b.dataset.mode==='picker')showPicker();else if(b.dataset.mode==='stats')showStats();else if(b.dataset.mode==='trigram')showTrigramHome();else if(b.dataset.mode==='generation')showFlash(false,'generation','generation');else if(b.dataset.mode==='palace')showFlash(false,'palace','palace');else if(b.dataset.mode==='worldElement')showFlash(false,'worldElement','worldElement');else showFlash(false,'flash','holding')});
    document.getElementById('smaller').onclick=()=>{scaleIndex=Math.max(0,scaleIndex-1);updateScale()};document.getElementById('normal').onclick=()=>{scaleIndex=1;updateScale()};document.getElementById('larger').onclick=()=>{scaleIndex=Math.min(2,scaleIndex+1);updateScale()};
    studyScreen.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchX=t.clientX;touchY=t.clientY},{passive:true});studyScreen.addEventListener('touchend',e=>{if(touchX===null)return;const t=e.changedTouches[0],dx=t.clientX-touchX,dy=t.clientY-touchY;touchX=touchY=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)openStudy(currentIndex+(dx<0?1:-1))},{passive:true});
    flashScreen.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;touchX=e.clientX;touchY=e.clientY;try{flashScreen.setPointerCapture(e.pointerId)}catch(_){} });flashScreen.addEventListener('pointerup',e=>{if(!e.isPrimary||touchX===null)return;const dx=e.clientX-touchX,dy=e.clientY-touchY,step=flashSwipeStep(dx,dy);touchX=touchY=null;if(step)moveFlashCard(step)});flashScreen.addEventListener('pointercancel',()=>{touchX=touchY=null});
    const resetInitialScroll=()=>{if(!initialNavigationChosen)window.scrollTo(0,0)};
    try{history.scrollRestoration='manual'}catch(_){}
    window.addEventListener('pageshow',()=>{resetInitialScroll();requestAnimationFrame(resetInitialScroll);setTimeout(resetInitialScroll,100);setTimeout(resetInitialScroll,350)},{once:true});
    const initialType=TRAINING_TYPES.includes(progress.lastType)?progress.lastType:'palace',initialMode=initialType==='holding'?'flash':initialType;
    updateScale();showFlash(false,initialMode,initialType,false);
    requestAnimationFrame(()=>requestAnimationFrame(resetInitialScroll));
  </script>
</body>
</html>
