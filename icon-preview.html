<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>序卦傳 App Icon 預覽</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f0e6; color: #143d29; }
    main { width: min(100%, 560px); margin: auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
    h1 { margin: 0 0 8px; font-size: 1.55rem; text-align: center; }
    p { margin: 0 0 18px; color: #536158; text-align: center; line-height: 1.5; }
    article { margin: 0 0 18px; padding: 12px; border: 1px solid #c9d2ca; border-radius: 20px; background: #fff; box-shadow: 0 4px 14px rgb(24 70 44 / 9%); }
    h2 { margin: 2px 0 10px; font-size: 1.15rem; text-align: center; }
    img { display: block; width: 100%; height: auto; border-radius: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>序卦傳 App Icon</h1>
    <p>三款手機預覽草案；目前尚未替換正式圖示。</p>
    <article><h2>一、前後卦箭頭</h2><img src="icon-preview-assets/sequence-arrows.png" alt="深綠底前後卦箭頭設計"></article>
    <article><h2>二、序卦書頁</h2><img src="icon-preview-assets/sequence-book.png" alt="米白底序卦書頁設計"></article>
    <article><h2>三、卦序循環</h2><img src="icon-preview-assets/sequence-cycle.png" alt="深藍底卦序循環設計"></article>
  </main>
</body>
</html>
