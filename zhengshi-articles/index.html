<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#0b4f2c">
  <title>易經證釋 白話文章</title>
  <style>
    :root { --ink:#172019; --green:#0b4f2c; --cream:#f5f1e8; --paper:#fff; --size:1.25rem; font-size:20px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; overflow-x:hidden; background:var(--cream); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; }
    button,select { font:inherit; }
    .shell { max-width:760px; margin:auto; padding:max(14px,env(safe-area-inset-top)) 12px calc(50px + env(safe-area-inset-bottom)); }
    .home { display:inline-block; padding:11px 15px; border:1px solid var(--green); border-radius:10px; color:var(--green); background:white; font-weight:800; text-decoration:none; }
    h1 { margin:14px 0 8px; color:var(--green); font-size:1.9rem; line-height:1.25; }
    .intro,.source { color:#546458; font-size:1rem; line-height:1.6; }
    .reader-settings { margin-top:8px; }
    .reader-settings > summary { display:none; padding:12px 14px; border:1px solid var(--green); border-radius:10px; background:white; color:var(--green); cursor:pointer; font-weight:800; }
    .toolbar { position:sticky; top:0; z-index:3; display:grid; gap:8px; padding:10px 0; background:var(--cream); }
    .selectors { display:grid; grid-template-columns:1fr 1.35fr .65fr; min-width:0; gap:8px; }
    select { min-width:0; flex:1; height:58px; padding:0 12px; border:1px solid #a8b9ab; border-radius:10px; background:white; color:var(--ink); font-size:1.05rem; font-weight:750; }
    .actions { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; }
    button,.compare { min-height:52px; padding:9px 6px; border:1px solid var(--green); border-radius:10px; background:white; color:var(--green); font-size:1rem; font-weight:800; }
    button:disabled { opacity:.4; }
    .compare { display:grid; place-items:center; text-decoration:none; }
    .status { min-height:1.5em; color:#5f6f63; font-size:1rem; line-height:1.5; }
    .history-panel { margin:8px 0 12px; border:1px solid #b9c8bb; border-radius:10px; background:#fff; }
    .history-panel summary { padding:12px 14px; color:var(--green); cursor:pointer; font-weight:800; }
    .history-list { display:grid; gap:7px; padding:0 10px 10px; }
    .history-item { min-height:44px; padding:8px 10px; text-align:left; font-size:.88rem; line-height:1.4; }
    article { height:auto; min-height:0; max-height:none; margin-top:12px; padding:0; overflow:visible; border:1px solid #d5dfd5; border-radius:14px; background:var(--paper); }
    .book-pages { width:100%; min-height:0; padding-top:16px; padding-bottom:4px; }
    .book-pages > * { margin-left:18px; margin-right:18px; }
    article h2 { margin-top:0; margin-bottom:18px; color:var(--green); font-size:1.5rem; line-height:1.4; }
    article h3 { margin-top:1.3em; margin-bottom:.7em; color:#526b57; font-size:1.05rem; line-height:1.5; }
    .paragraph { margin-top:0; margin-bottom:.8em; font-family:"PMingLiU","Noto Serif TC",serif; font-size:var(--size); line-height:1.7; overflow-wrap:anywhere; }
    .note { margin-top:.5em; margin-bottom:1em; padding:10px 12px; border-left:4px solid #a9b99d; background:#f8f8f1; color:#5d674d; font-size:.92rem; line-height:1.65; overflow-wrap:anywhere; }
    .note summary { cursor:pointer; font-weight:800; }
    .figure-symbol { display:inline-block; height:auto; fill:currentColor; vertical-align:middle; margin:0 .08em; overflow:visible; }
    .hexagram-name { white-space:nowrap; }
    .hexagram-glyph { display:inline-block; margin-left:.16em; color:#9a6b18; font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","Arial Unicode MS",sans-serif; font-size:1.15em; font-style:normal; font-weight:400; line-height:1; vertical-align:-.07em; }
    .source-figure { width:1.25em; height:1.25em; object-fit:contain; vertical-align:-.2em; margin:0 .06em; }
    .figure-unresolved { color:#775d32; font-size:.8em; }
    .source { margin-top:24px; font-size:.9rem; }
    .source a { color:var(--green); font-weight:800; }
    .page-navigation { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-top:10px; }
    .page-navigation button { min-height:58px; }
    .page-indicator { min-width:72px; color:#526357; text-align:center; font-weight:800; }
    .offline-box { margin:12px 0; }
    .offline-download { width:100%; min-height:58px; background:var(--green); color:#fff; }
    .offline-download:disabled { opacity:.68; }
    .offline-status { min-height:1.4em; margin:6px 4px 0; color:#526357; font-size:.86rem; line-height:1.45; }
    @media(max-width:600px) {
      .shell { padding-left:10px; padding-right:10px; }
      header { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px; }
      .home { padding:9px 11px; font-size:.88rem; }
      h1 { margin:0; font-size:1.32rem; }
      .intro { display:none; }
      .reader-settings > summary { display:block; }
      .toolbar { position:static; }
      .selectors { grid-template-columns:1fr; }
      .actions { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .status { margin:8px 2px; font-size:.84rem; }
      .page-navigation { position:sticky; bottom:0; z-index:4; margin-top:8px; padding:7px 0 calc(7px + env(safe-area-inset-bottom)); background:var(--cream); }
      .history-panel { margin-top:12px; }
      .source { display:none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <a class="home" href="../">← 回到首頁</a>
      <h1>易經證釋 白話文章</h1>
      <p class="intro">這是白話文章電子書版：依文意接成完整段落，再按手機畫面逐頁閱讀，共一千二百零三篇。</p>
    </header>
    <details id="reader-settings" class="reader-settings">
      <summary>選擇冊別、文章、頁碼與字級</summary>
      <nav class="toolbar" aria-label="閱讀工具">
        <div class="selectors"><select id="volume" aria-label="選擇冊別"></select><select id="chapter" aria-label="選擇文章"></select><select id="page" aria-label="選擇頁碼"></select></div>
        <div class="actions">
          <button id="previous" type="button">上一頁</button><button id="next" type="button">下一頁</button>
          <button id="decrease" type="button" aria-label="縮小文字">A−</button><button id="increase" type="button" aria-label="放大文字">A＋</button>
        </div>
      </nav>
    </details>
    <p id="status" class="status" role="status"></p>
    <article id="content" aria-live="polite"><div id="pages" class="book-pages"></div></article>
    <nav class="page-navigation" aria-label="翻頁">
      <button id="bottom-previous" type="button">← 上一頁</button><span id="page-indicator" class="page-indicator">1 / 1</span><button id="bottom-next" type="button">下一頁 →</button>
    </nav>
    <section class="offline-box" aria-label="離線閱讀">
      <button id="offline-download" class="offline-download" type="button">↓ 下載全 20 冊・離線閱讀</button>
      <p id="offline-status" class="offline-status" role="status" aria-live="polite"></p>
    </section>
    <details id="history-panel" class="history-panel"><summary id="history-summary">閱讀紀錄</summary><div id="history-list" class="history-list"></div></details>
    <p class="source">內容取自唯心資料庫正式「易經證釋 白話文章」連續閱讀版；與逐句對照的「白話」欄分開。要逐句查看原文與白話，請開啟<a href="../zhengshi/">易經證釋－白話</a>。</p>
  </main>
  <script src="reader.js?v=ebook-5"></script>
</body>
</html>
