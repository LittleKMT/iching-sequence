<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="六十四卦">
  <title>序卦傳・六十四卦記憶</title>
  <style>
    :root { --scale: 1; --green: #0b4f2c; --cream: #f5f1e8; --ink: #172019; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--cream); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
    button { font: inherit; }
    #page-top { position: absolute; top: 0; }
    .shell { width: min(100%, 680px); margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 12px calc(34px + env(safe-area-inset-bottom)); }
    header { text-align: center; padding: 8px 4px 14px; }
    h1 { margin: 0; color: var(--green); font-size: calc(1.75rem * var(--scale)); line-height: 1.25; }
    .subtitle { margin: 6px 0 0; font-size: calc(.95rem * var(--scale)); color: #526056; }
    .controls { position: sticky; top: 0; z-index: 20; margin: 0 -2px 10px; padding: 4px 2px; background: color-mix(in srgb, var(--cream) 94%, transparent); backdrop-filter: blur(10px); }
    .control-row { display: grid; gap: 5px; margin-bottom: 3px; }
    .control-row.five { grid-template-columns: repeat(5, 1fr); }
    .control-row.four { grid-template-columns: repeat(4, 1fr); }
    .control-row.three { grid-template-columns: repeat(3, 1fr); }
    .control-row.one { grid-template-columns: 1fr; margin-bottom: 0; }
    .control { min-width: 0; min-height: 44px; padding: 9px 4px; border: 1px solid #bdc6bd; border-radius: 12px; background: #fff; color: #1c2820; font-size: calc(.92rem * var(--scale)); font-weight: 750; box-shadow: 0 1px 2px #0000000c; }
    .control:active { transform: translateY(1px); }
    .control.active, .control.primary { color: #fff; border-color: var(--green); background: var(--green); }
    .screen[hidden] { display: none !important; }
    #flash-screen, #order-screen { padding-bottom: 45vh; }
    .section-title { margin: 18px 0 10px; font-size: calc(1.25rem * var(--scale)); color: var(--green); }
    .study-list { display: grid; gap: 12px; }
    .study-card, .single-card, .flash-card, .order-card { overflow: hidden; border: 1px solid #d9d4c8; border-radius: 20px; background: #fff; box-shadow: 0 5px 18px #2033250d; }
    .study-card { display: grid; grid-template-columns: 94px 1fr; align-items: stretch; }
    .study-head { display: grid; place-items: center; align-content: center; padding: 14px 8px; background: #edf4ee; }
    .hex-symbol { font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", serif; color: var(--green); line-height: .9; }
    .study-head .hex-symbol { font-size: calc(4.8rem * var(--scale)); }
    .ordinal { margin-top: 8px; color: #607064; font-size: calc(.74rem * var(--scale)); }
    .study-body { min-width: 0; padding: 14px; }
    .hex-name { margin: 0 0 8px; font-size: calc(1.45rem * var(--scale)); color: var(--green); }
    .label { margin: 9px 0 2px; color: #6c766d; font-size: calc(.72rem * var(--scale)); font-weight: 800; letter-spacing: .08em; }
    .text { margin: 0; font-size: calc(1.06rem * var(--scale)); line-height: 1.65; }
    .plain[hidden] { display: none; }
    .picker-intro { margin: 0 0 12px; text-align: center; font-size: calc(1rem * var(--scale)); line-height: 1.55; color: #526056; }
    .picker-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; width: 100%; }
    .picker-item { min-width: 0; padding: 12px 2px 10px; border: 1px solid #ccd5cc; border-radius: 15px; background: #fff; color: var(--green); text-align: center; overflow: hidden; }
    .picker-item .hex-symbol { display: block; font-size: calc(7rem * var(--scale)); }
    .picker-name { display: block; margin-top: 7px; font-size: calc(.98rem * var(--scale)); font-weight: 850; white-space: nowrap; }
    .picker-no { display: block; margin-top: 2px; color: #718075; font-size: calc(.68rem * var(--scale)); }
    .single-card { padding: 14px 16px; text-align: center; touch-action: pan-y; }
    .single-card .hex-symbol { margin: 2px 0 -18px; font-size: calc(9.5rem * var(--scale)); font-weight: 800; -webkit-text-stroke: .6px currentColor; }
    .single-card .hex-name { margin-bottom: 4px; font-size: calc(2rem * var(--scale)); }
    .single-copy { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e6e2d8; text-align: left; }
    .single-copy .label { margin-top: 6px; }
    .single-copy .text { line-height: 1.45; }
    .swipe-hint { margin-top: 10px; color: #657168; font-size: calc(.82rem * var(--scale)); font-weight: 750; }
    .study-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .study-nav button { min-height: 46px; border: 1px solid #b8c3ba; border-radius: 13px; background: #fff; color: var(--green); font-size: calc(.9rem * var(--scale)); font-weight: 800; }
    .back-button { width: 100%; margin-top: 10px; min-height: 48px; border: 0; border-radius: 14px; color: #fff; background: var(--green); font-size: calc(1rem * var(--scale)); font-weight: 800; }
    .flash-card { padding: 18px 12px; text-align: center; }
    .flash-count { color: #617064; font-size: calc(.9rem * var(--scale)); }
    .flash-main .hex-symbol, .answer-cell .hex-symbol { display: block; margin: 18px auto 8px; }
    .flash-main .hex-symbol { margin-top: 8px; margin-bottom: -18px; }
    .flash-main .hex-symbol { font-size: calc(10rem * var(--scale)); }
    .answer-cell .hex-symbol { font-size: calc(8rem * var(--scale)); }
    .flash-main .hex-name, .answer-cell .hex-name { font-size: calc(1.9rem * var(--scale)); font-weight: 850; color: var(--green); }
    .flash-question { margin: 10px 0 9px; font-size: calc(1.25rem * var(--scale)); font-weight: 800; }
    .answer-toggle { min-height: 48px; padding: 10px 24px; border: 1px solid var(--green); border-radius: 14px; background: #fff; color: var(--green); font-size: calc(1rem * var(--scale)); font-weight: 850; }
    .flash-answer { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .flash-answer[hidden] { display: none; }
    .answer-cell { min-width: 0; padding: 12px 2px; border-radius: 16px; background: #edf4ee; overflow: hidden; }
    .answer-label { color: #617064; font-size: calc(.82rem * var(--scale)); font-weight: 750; }
    .flash-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .flash-nav button, .reshuffle { min-height: 48px; border: 1px solid #b8c3ba; border-radius: 14px; background: #fff; font-size: calc(1rem * var(--scale)); font-weight: 800; }
    .reshuffle { width: 100%; margin-top: 9px; color: #fff; border-color: var(--green); background: var(--green); }
    .order-card { padding: 12px 14px 14px; text-align: center; }
    .order-title { margin: 0; color: var(--green); font-size: calc(1.05rem * var(--scale)); line-height: 1.2; white-space: nowrap; }
    .order-status { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; margin: 8px 0; }
    .order-progress { min-height: 1.5em; margin: 0; color: #617064; font-size: calc(.9rem * var(--scale)); font-weight: 750; text-align: left; }
    .order-symbol-toggle { min-height: 38px; padding: 6px 10px; border: 1px solid var(--green); border-radius: 12px; background: #fff; color: var(--green); font-size: calc(.86rem * var(--scale)); font-weight: 800; white-space: nowrap; }
    .order-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .order-choice { position: relative; min-height: 64px; padding: 9px 8px; display: grid; place-items: center; align-content: center; border: 2px solid #b8c3ba; border-radius: 15px; background: #fff; color: var(--green); font-weight: 850; overflow: hidden; }
    .order-choice.with-symbol { min-height: 128px; padding-top: 5px; padding-bottom: 8px; }
    .order-choice.selected { color: #fff; border-color: var(--green); background: var(--green); }
    .order-hex { display: block; margin: -4px 0 0; color: currentColor; font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", serif; font-size: calc(4.6rem * var(--scale)); font-weight: 800; line-height: 1; -webkit-text-stroke: .4px currentColor; }
    .order-name { display: block; white-space: nowrap; font-size: calc(1.9rem * var(--scale)); line-height: 1; }
    .order-name.single { font-size: calc(2.2rem * var(--scale)); }
    .order-number { position: absolute; top: 7px; right: 7px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: var(--green); font-size: .86rem; font-weight: 900; box-shadow: 0 1px 4px #0002; }
    .order-feedback { min-height: 2.2em; margin: 8px 0 0; display: grid; place-items: center; color: #8b2727; font-size: calc(1rem * var(--scale)); font-weight: 800; line-height: 1.15; }
    .order-feedback.correct { color: var(--green); font-size: calc(1.12rem * var(--scale)); }
    .order-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .order-actions button { min-height: 48px; padding: 8px 4px; border: 1px solid var(--green); border-radius: 14px; background: #fff; color: var(--green); font-size: calc(1rem * var(--scale)); font-weight: 800; white-space: nowrap; }
    .order-actions .next-order { color: #fff; background: var(--green); }
    .empty { padding: 30px; text-align: center; color: #68746a; }
    @media (max-width: 370px) {
      .shell { padding-left: 8px; padding-right: 8px; }
      .control { font-size: calc(.82rem * var(--scale)); }
      .study-card { grid-template-columns: 82px 1fr; }
      .study-head .hex-symbol { font-size: calc(4.25rem * var(--scale)); }
      .picker-grid { gap: 6px; }
      .picker-item .hex-symbol { font-size: calc(6.2rem * var(--scale)); }
      .flash-main .hex-symbol { font-size: calc(8.5rem * var(--scale)); }
      .answer-cell .hex-symbol { font-size: calc(6.8rem * var(--scale)); }
    }
  </style>
</head>
<body>
  <span id="page-top" aria-hidden="true"></span>
  <main class="shell">
    <header>
      <h1>序卦傳・六十四卦記憶</h1>
      <p class="subtitle">原文、白話與前後卦閃卡</p>
    </header>

    <nav class="controls" aria-label="學習工具">
      <div class="control-row five">
        <button class="control" data-mode="all">全部</button>
        <button class="control" data-mode="upper">上經</button>
        <button class="control" data-mode="lower">下經</button>
        <button class="control" data-mode="flash">閃卡</button>
        <button class="control" data-mode="order">排序</button>
      </div>
      <div class="control-row three">
        <button class="control" id="font-down" aria-label="縮小文字">A−</button>
        <button class="control" id="font-reset">A 標準</button>
        <button class="control" id="font-up" aria-label="放大文字">A＋</button>
      </div>
      <div class="control-row three">
        <button class="control" id="plain-toggle">隱藏白話</button>
        <button class="control" id="top-button">回頂端</button>
        <button class="control" id="restart-button">重頭練習</button>
      </div>
      <div class="control-row one">
        <button class="control primary" id="picker-button">64卦</button>
      </div>
    </nav>

    <section id="list-screen" class="screen"></section>
    <section id="picker-screen" class="screen" hidden>
      <h2 class="section-title">六十四卦</h2>
      <p class="picker-intro">點選任一卦，直接查看該卦的《序卦傳》核心原文與白話。</p>
      <div id="picker-grid" class="picker-grid"></div>
    </section>
    <section id="single-screen" class="screen" hidden></section>
    <section id="flash-screen" class="screen" hidden></section>
    <section id="order-screen" class="screen" hidden></section>
  </main>

  <script>
    const names = ['乾','坤','屯','蒙','需','訟','師','比','小畜','履','泰','否','同人','大有','謙','豫','隨','蠱','臨','觀','噬嗑','賁','剝','復','無妄','大畜','頤','大過','坎','離','咸','恆','遯','大壯','晉','明夷','家人','睽','蹇','解','損','益','夬','姤','萃','升','困','井','革','鼎','震','艮','漸','歸妹','豐','旅','巽','兌','渙','節','中孚','小過','既濟','未濟'];
    const originals = [
      '有天地。','有天地，然後萬物生焉。','萬物生焉。','物生必蒙。','物稚不可不養。','飲食必有訟。','訟必有眾起。','眾必有所比。','比必有所畜。','物畜然後有禮。','履而泰然後安。','物不可以終通。','物不可以終否。','與人同者物必歸焉。','有大者不可以盈。','有大而能謙必豫。','豫必有隨。','以喜隨人者必有事。','有事而後可大。','物大然後可觀。','可觀而後有所合。','物不可以苟合而已。','賁者飾也，致飾然後亨則盡矣。','物不可以終盡，剝窮上反下。','復則不妄矣。','有無妄然後可畜。','物畜然後可養。','不養則不可動。','物不可以終過。','陷必有所麗。',
      '有天地然後有萬物，有萬物然後有男女，有男女然後有夫婦。','夫婦之道不可以不久。','物不可以久居其所。','物不可以終遯。','物不可以終壯。','晉者進也，進必有所傷。','傷於外者必反於家。','家道窮必乖。','睽者乖也，乖必有難。','物不可以終難。','解者緩也，緩必有所失。','損而不已必益。','益而不已必決。','夬者決也，決必有所遇。','姤者遇也，物相遇而後聚。','萃者聚也，聚而上者謂之升。','升而不已必困。','困乎上者必反下。','井道不可不革。','革物者莫若鼎。','主器者莫若長子。','震者動也，物不可以終動。','艮者止也，物不可以終止。','漸者進也，進必有所歸。','得其所歸者必大。','豐者大也，窮大者必失其居。','旅而無所容。','巽者入也，入而後說之。','兌者說也，說而後散之。','渙者離也，物不可以終離。','節而信之。','有其信者必行之。','有過物者必濟。','物不可窮也。'
    ];
    const plains = [
      '乾為天，是六十四卦與天地秩序的開始。','坤為地；天地具備，萬物才開始產生。','天地相交，萬物開始萌生。','萬物初生，必然幼稚蒙昧。','幼小的事物必須養育。','有飲食需求，就容易發生爭奪。','爭訟發生，就會有眾人聚起。','眾人聚集，就會彼此親近依附。','彼此親近，就會有所蓄聚。','有了蓄積，才有禮節規範。','依禮而行，才能通泰安定。','事物不可能永遠通泰。','事物也不可能永遠閉塞。','與人同心，眾物自然歸附。','擁有很多，不可以自滿。','有成就又能謙虛，自然安樂。','安樂喜悅，就會有人跟隨。','喜悅地跟隨別人，必然會有事情發生。','有事需要處理，處理之後才能壯大。','事物壯大之後，才值得觀看。','有所觀察之後，才會有所結合。','事物不能只是隨便結合，還需要文飾。','文飾到了極點，就開始走向剝落。','事物不能永遠剝盡，剝到極點就會返回。','回復正道，就不會妄為。','不妄為，然後才能有所蓄積。','有了蓄積，然後才能養育。','不經養育，就不能有所行動。','事物不可能永遠過度。','陷入險境，就必須有所依附。',
      '天地有萬物，萬物分男女，男女結為夫婦。','夫婦之道應當長久。','事物不能永遠停留在原處。','事物不能一直退避。','事物不能永遠只求壯盛，壯盛就要前進。','向前進展，難免有所受傷。','在外受到傷害，就會返回家中。','家道走到困窮，就容易產生分歧。','彼此分歧，就會產生困難。','困難不可能永遠持續。','困難解除而鬆緩，就容易有所損失。','損減到一定程度，就會轉而增加。','增加到一定程度，就必須有所決斷。','有所決斷之後，必然有所相遇。','事物相遇之後，就會聚集。','眾物聚集之後，就會向上發展。','不斷向上發展，終究會遇到困境。','在上面陷入困境，就會返回下方尋找根本。','井用久了需要整治革新。','要革新事物，沒有比鼎更具代表性。','主持重要器物與事業，莫若由長子承擔。','震就是動，但事物不能永遠不停地動。','艮就是停止，但事物也不能永遠停止。','逐漸前進，最後必有所歸宿。','得到歸宿之後，就會發展壯大。','盛大到了極點，反而容易失去安居之所。','旅居在外無所容身，就需要順勢進入。','順勢進入之後，彼此就能和悅。','喜悅之後，精神情緒就會舒散。','渙散分離不能一直持續，需要有所節制。','有了節制規範，才能建立信用。','有了誠信，就要付諸行動。','有所超越，事情才能有所完成。','事物不會真正窮盡，完成之後仍會繼續發展。'
    ];
    const hexagrams = names.map((name, i) => ({ name, symbol: String.fromCodePoint(0x4dc0 + i), original: originals[i], plain: plains[i] }));
    if (hexagrams.length !== 64 || originals.length !== 64 || plains.length !== 64) throw new Error('六十四卦資料不完整');

    const screens = ['list-screen','picker-screen','single-screen','flash-screen','order-screen'].map(id => document.getElementById(id));
    const listScreen = document.getElementById('list-screen');
    const pickerScreen = document.getElementById('picker-screen');
    const singleScreen = document.getElementById('single-screen');
    const flashScreen = document.getElementById('flash-screen');
    const orderScreen = document.getElementById('order-screen');
    let currentMode = 'all';
    let showPlain = true;
    let scaleIndex = 1;
    const scales = [.86, 1, 1.18];
    let deck = [];
    let deckPosition = 0;
    let currentStudyIndex = 0;
    let orderSequence = [];
    let orderChoices = [];
    let orderSelections = [];
    let orderQuestionDeck = [];
    let showOrderSymbols = true;
    let touchStartX = null;
    let touchStartY = null;

    function hideScreens() { screens.forEach(screen => screen.hidden = true); }
    function scrollTopNow() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }
    function centerFlashElement(selector) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const element = document.querySelector(selector);
        if (!element) return;
        element.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
        setTimeout(() => {
          const controls = document.querySelector('.controls');
          const visibleTarget = selector === '.flash-main'
            ? document.querySelector('.flash-main .hex-symbol')
            : element;
          if (!controls || !visibleTarget) return;
          const safeTop = controls.getBoundingClientRect().bottom + 10;
          const targetTop = visibleTarget.getBoundingClientRect().top;
          if (targetTop < safeTop) {
            window.scrollBy({ top: targetTop - safeTop, behavior: 'smooth' });
          }
        }, 450);
      }));
    }
    function alignStudyCard() {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const card = singleScreen.querySelector('.single-card');
        if (!card) return;
        card.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'nearest' });
        setTimeout(() => {
          const controls = document.querySelector('.controls');
          if (!controls) return;
          const safeTop = controls.getBoundingClientRect().bottom + 10;
          const cardTop = card.getBoundingClientRect().top;
          window.scrollBy({ top: cardTop - safeTop, behavior: 'smooth' });
        }, 450);
      }));
    }
    function alignOrderCard() {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const card = orderScreen.querySelector('.order-card');
        if (!card) return;
        card.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'nearest' });
        setTimeout(() => {
          const controls = document.querySelector('.controls');
          if (!controls) return;
          const safeTop = controls.getBoundingClientRect().bottom + 10;
          const cardTop = card.getBoundingClientRect().top;
          window.scrollBy({ top: cardTop - safeTop, behavior: 'smooth' });
        }, 450);
      }));
    }
    function setActive(mode) {
      document.querySelectorAll('[data-mode]').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      document.getElementById('picker-button').classList.toggle('active', mode === 'picker');
    }
    function studyMarkup(item, i) {
      return `<article class="study-card" id="hex-${i + 1}"><div class="study-head"><span class="hex-symbol">${item.symbol}</span><span class="ordinal">第 ${i + 1} 卦</span></div><div class="study-body"><h3 class="hex-name">${item.name}</h3><div class="label">序卦傳核心原文</div><p class="text">${item.original}</p><div class="plain" ${showPlain ? '' : 'hidden'}><div class="label">白話記憶</div><p class="text">${item.plain}</p></div></div></article>`;
    }
    function showList(mode, shouldScroll = true) {
      currentMode = mode;
      hideScreens();
      listScreen.hidden = false;
      setActive(mode);
      const start = mode === 'lower' ? 30 : 0;
      const end = mode === 'upper' ? 30 : 64;
      const title = mode === 'upper' ? '上經・第一至三十卦' : mode === 'lower' ? '下經・第三十一至六十四卦' : '六十四卦原文與白話';
      listScreen.innerHTML = `<h2 class="section-title">${title}</h2><div class="study-list">${hexagrams.slice(start, end).map((item, offset) => studyMarkup(item, start + offset)).join('')}</div>`;
      if (shouldScroll) scrollTopNow();
    }
    function showPicker(shouldScroll = true) {
      currentMode = 'picker';
      hideScreens();
      pickerScreen.hidden = false;
      setActive('picker');
      if (shouldScroll) scrollTopNow();
    }
    function openStudy(i) {
      i = (i + 64) % 64;
      currentStudyIndex = i;
      currentMode = 'single';
      hideScreens();
      singleScreen.hidden = false;
      setActive('');
      const item = hexagrams[i];
      singleScreen.innerHTML = `<article class="single-card"><div class="ordinal">第 ${i + 1} 卦</div><div class="hex-symbol">${item.symbol}</div><h2 class="hex-name">${item.name}</h2><div class="single-copy"><div class="label">序卦傳核心原文</div><p class="text">${item.original}</p><div class="plain" ${showPlain ? '' : 'hidden'}><div class="label">白話記憶</div><p class="text">${item.plain}</p></div></div><div class="swipe-hint">向右滑上一卦　·　向左滑下一卦</div><div class="study-nav"><button type="button" onclick="openStudy(${i - 1})">← 上一卦</button><button type="button" onclick="openStudy(${i + 1})">下一卦 →</button></div><button class="back-button" type="button" onclick="showPicker()">← 回六十四卦</button></article>`;
      alignStudyCard();
    }
    function completeStudySwipe(endX, endY) {
      if (touchStartX === null) return;
      const deltaX = endX - touchStartX;
      const deltaY = endY - touchStartY;
      touchStartX = null;
      touchStartY = null;
      if (Math.abs(deltaX) < 55 || Math.abs(deltaX) <= Math.abs(deltaY) * 1.25) return;
      openStudy(currentStudyIndex + (deltaX < 0 ? 1 : -1));
    }
    function shuffleDeck() {
      deck = Array.from({ length: 64 }, (_, i) => i);
      for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
      deckPosition = 0;
    }
    function secureRandomInt(max) {
      if (globalThis.crypto?.getRandomValues) {
        const range = 0x100000000;
        const limit = Math.floor(range / max) * max;
        const value = new Uint32Array(1);
        do { crypto.getRandomValues(value); } while (value[0] >= limit);
        return value[0] % max;
      }
      return Math.floor(Math.random() * max);
    }
    function shuffled(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = secureRandomInt(i + 1);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      if (copy.length > 1 && copy.every((item, i) => item === items[i])) copy.push(copy.shift());
      return copy;
    }
    function refillOrderQuestionDeck() {
      const questions = [];
      for (let length = 3; length <= 5; length++) {
        for (let start = 0; start <= 64 - length; start++) questions.push({ start, length });
      }
      orderQuestionDeck = shuffled(questions);
    }
    function newOrderQuestion() {
      if (orderQuestionDeck.length === 0) refillOrderQuestionDeck();
      const { start, length } = orderQuestionDeck.pop();
      orderSequence = Array.from({ length }, (_, i) => start + i);
      orderChoices = shuffled(orderSequence);
      orderSelections = [];
    }
    function renderOrder() {
      const complete = orderSelections.length === orderSequence.length;
      const correct = complete && orderSelections.every((item, i) => item === orderSequence[i]);
      const progressText = `已選 ${orderSelections.length} / ${orderSequence.length}`;
      const feedback = correct
        ? `答對！<br>${orderSequence.map(i => hexagrams[i].name).join(' → ')}`
        : complete
          ? '順序不對，請取消後重新調整。'
          : orderSelections.length === 0 ? '依正確順序逐一點選' : '再點一次已選卦，即可取消並重新編號';
      orderScreen.innerHTML = `<article class="order-card"><h2 class="order-title">1到64卦正確順序排列</h2><div class="order-status"><div class="order-progress">${progressText}</div><button class="order-symbol-toggle" type="button" data-order-action="symbols">${showOrderSymbols ? '隱藏卦象' : '顯示卦象'}</button></div><div class="order-grid">${orderChoices.map(i => { const position = orderSelections.indexOf(i); const item = hexagrams[i]; const selectionLabel = position >= 0 ? `，排序第 ${position + 1}` : ''; return `<button class="order-choice${showOrderSymbols ? ' with-symbol' : ''}${position >= 0 ? ' selected' : ''}" type="button" data-order-index="${i}" aria-label="${item.name}${selectionLabel}">${position >= 0 ? `<span class="order-number">${position + 1}</span>` : ''}${showOrderSymbols ? `<span class="order-hex" aria-hidden="true">${item.symbol}</span>` : ''}<span class="order-name${item.name.length === 1 ? ' single' : ''}">${item.name}</span></button>`; }).join('')}</div><div class="order-feedback${correct ? ' correct' : ''}" aria-live="polite">${feedback}</div><div class="order-actions"><button type="button" data-order-action="reset">重新本題</button><button class="next-order" type="button" data-order-action="next">隨機下一題</button></div></article>`;
    }
    function showOrder(newQuestion = true) {
      currentMode = 'order';
      if (newQuestion || orderSequence.length === 0) newOrderQuestion();
      hideScreens();
      orderScreen.hidden = false;
      setActive('order');
      renderOrder();
      alignOrderCard();
    }
    function showFlash(newDeck = false) {
      currentMode = 'flash';
      if (newDeck || deck.length === 0) shuffleDeck();
      hideScreens();
      flashScreen.hidden = false;
      setActive('flash');
      renderFlash();
    }
    function renderFlash() {
      const i = deck[deckPosition];
      const prev = (i + 63) % 64;
      const next = (i + 1) % 64;
      flashScreen.innerHTML = `<article class="flash-card"><div class="flash-count">第 ${deckPosition + 1} / 64 題</div><div class="flash-main"><span class="hex-symbol">${hexagrams[i].symbol}</span><div class="hex-name">${hexagrams[i].name}</div></div><div class="flash-question">前一卦？　後一卦？</div><button class="answer-toggle" type="button" id="answer-toggle">顯示答案</button><div class="flash-nav"><button type="button" id="flash-prev">← 上一題</button><button type="button" id="flash-next">下一題 →</button></div><div class="flash-answer" id="flash-answer" hidden><div class="answer-cell"><div class="answer-label">前一卦</div><span class="hex-symbol">${hexagrams[prev].symbol}</span><div class="hex-name">${hexagrams[prev].name}</div></div><div class="answer-cell"><div class="answer-label">後一卦</div><span class="hex-symbol">${hexagrams[next].symbol}</span><div class="hex-name">${hexagrams[next].name}</div></div></div><button class="reshuffle" type="button" id="reshuffle">重新隨機開始</button></article>`;
      document.getElementById('answer-toggle').addEventListener('click', () => {
        const answer = document.getElementById('flash-answer');
        answer.hidden = !answer.hidden;
        document.getElementById('answer-toggle').textContent = answer.hidden ? '顯示答案' : '隱藏答案';
        centerFlashElement(answer.hidden ? '.flash-main' : '.flash-answer');
      });
      document.getElementById('flash-prev').addEventListener('click', () => { deckPosition = (deckPosition + 63) % 64; renderFlash(); });
      document.getElementById('flash-next').addEventListener('click', () => { deckPosition = (deckPosition + 1) % 64; renderFlash(); });
      document.getElementById('reshuffle').addEventListener('click', () => { shuffleDeck(); renderFlash(); });
      centerFlashElement('.flash-main');
    }
    function updatePlain() {
      document.querySelectorAll('.plain').forEach(el => el.hidden = !showPlain);
      document.getElementById('plain-toggle').textContent = showPlain ? '隱藏白話' : '顯示白話';
    }
    function updateScale() {
      document.documentElement.style.setProperty('--scale', scales[scaleIndex]);
      try { localStorage.setItem('iching-scale', String(scaleIndex)); } catch (_) {}
      if (currentMode === 'order' && !orderScreen.hidden) alignOrderCard();
    }

    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {
      const mode = button.dataset.mode;
      if (mode === 'flash') showFlash(true);
      else if (mode === 'order') showOrder(true);
      else showList(mode);
    }));
    document.getElementById('font-down').addEventListener('click', () => { scaleIndex = Math.max(0, scaleIndex - 1); updateScale(); });
    document.getElementById('font-reset').addEventListener('click', () => { scaleIndex = 1; updateScale(); });
    document.getElementById('font-up').addEventListener('click', () => { scaleIndex = Math.min(scales.length - 1, scaleIndex + 1); updateScale(); });
    document.getElementById('plain-toggle').addEventListener('click', () => { showPlain = !showPlain; updatePlain(); });
    document.getElementById('top-button').addEventListener('click', scrollTopNow);
    document.getElementById('restart-button').addEventListener('click', () => showFlash(true));
    document.getElementById('picker-button').addEventListener('click', () => showPicker());
    document.getElementById('picker-grid').innerHTML = hexagrams.map((item, i) => `<button class="picker-item" type="button" data-index="${i}"><span class="hex-symbol">${item.symbol}</span><span class="picker-name">${item.name}</span><span class="picker-no">第 ${i + 1} 卦</span></button>`).join('');
    document.getElementById('picker-grid').addEventListener('click', event => { const button = event.target.closest('.picker-item'); if (button) openStudy(Number(button.dataset.index)); });
    orderScreen.addEventListener('click', event => {
      const choice = event.target.closest('[data-order-index]');
      const action = event.target.closest('[data-order-action]');
      if (choice) {
        const index = Number(choice.dataset.orderIndex);
        const selectedPosition = orderSelections.indexOf(index);
        if (selectedPosition >= 0) orderSelections.splice(selectedPosition, 1);
        else if (orderSelections.length < orderSequence.length) orderSelections.push(index);
        renderOrder();
      } else if (action?.dataset.orderAction === 'reset') {
        orderSelections = [];
        renderOrder();
      } else if (action?.dataset.orderAction === 'symbols') {
        showOrderSymbols = !showOrderSymbols;
        renderOrder();
        alignOrderCard();
      } else if (action?.dataset.orderAction === 'next') {
        showOrder(true);
      }
    });
    singleScreen.addEventListener('touchstart', event => {
      if (event.touches.length !== 1) return;
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
    }, { passive: true });
    singleScreen.addEventListener('touchend', event => {
      if (event.changedTouches.length !== 1) return;
      completeStudySwipe(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
    }, { passive: true });
    singleScreen.addEventListener('touchcancel', () => { touchStartX = null; touchStartY = null; }, { passive: true });
    singleScreen.addEventListener('pointerdown', event => {
      if (event.pointerType === 'touch') return;
      touchStartX = event.clientX;
      touchStartY = event.clientY;
    });
    singleScreen.addEventListener('pointerup', event => {
      if (event.pointerType === 'touch') return;
      completeStudySwipe(event.clientX, event.clientY);
    });
    singleScreen.addEventListener('pointercancel', () => { touchStartX = null; touchStartY = null; });
    try { const saved = Number(localStorage.getItem('iching-scale')); if ([0,1,2].includes(saved)) scaleIndex = saved; } catch (_) {}
    updateScale();
    updatePlain();
    showList('all', false);
  </script>
</body>
</html>
