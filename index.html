<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="六十四卦">
  <title>序卦傳・六十四卦記憶</title>
  <style>
    :root { --scale: 1; --green: #0b4f2c; --cream: #f5f1e8; --ink: #172019; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--cream); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
    button { font: inherit; }
    #page-top { position: absolute; top: 0; }
    .shell { width: min(100%, 680px); margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 12px calc(34px + env(safe-area-inset-bottom)); }
    header { text-align: center; padding: 8px 4px 14px; }
    h1 { margin: 0; color: var(--green); font-size: calc(1.75rem * var(--scale)); line-height: 1.25; }
    .subtitle { margin: 6px 0 0; font-size: calc(.95rem * var(--scale)); color: #526056; }
    .controls { position: sticky; top: 0; z-index: 20; margin: 0 -2px 10px; padding: 4px 2px; background: color-mix(in srgb, var(--cream) 94%, transparent); backdrop-filter: blur(10px); }
    .controls.flash-focus { position: relative; top: auto; backdrop-filter: none; }
    .controls.all-focus { position: relative; top: auto; backdrop-filter: none; }
    .controls.english-focus { position: relative; top: auto; backdrop-filter: none; }
    .control-row { display: grid; gap: 5px; margin-bottom: 3px; }
    .control-row.five { grid-template-columns: repeat(5, 1fr); }
    .control-row.six { grid-template-columns: repeat(6, 1fr); }
    .control-row.four { grid-template-columns: repeat(4, 1fr); }
    .control-row.three { grid-template-columns: repeat(3, 1fr); }
    .control-row.one { grid-template-columns: 1fr; margin-bottom: 0; }
    .control { min-width: 0; min-height: 44px; padding: 9px 4px; border: 1px solid #bdc6bd; border-radius: 12px; background: #fff; color: #1c2820; font-size: calc(.92rem * var(--scale)); font-weight: 750; box-shadow: 0 1px 2px #0000000c; }
    .control:active { transform: translateY(1px); }
    .control.active, .control.primary { color: #fff; border-color: var(--green); background: var(--green); }
    .screen[hidden] { display: none !important; }
    #flash-screen, #order-screen, #english-screen { padding-bottom: 45vh; }
    #flash-screen { scroll-margin-top: max(8px, env(safe-area-inset-top)); }
    .section-title { margin: 18px 0 10px; font-size: calc(1.25rem * var(--scale)); color: var(--green); }
    .all-view-options { position: sticky; top: max(0px, env(safe-area-inset-top)); z-index: 25; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin: 0 0 10px; padding: 6px 0; background: color-mix(in srgb, var(--cream) 96%, transparent); backdrop-filter: blur(10px); }
    .all-view-options button { min-width: 0; min-height: 42px; padding: 6px 2px; border: 1px solid #b8c3ba; border-radius: 11px; background: #fff; color: var(--green); font-size: calc(.86rem * var(--scale)); font-weight: 850; }
    .all-view-options button.active { border-color: var(--green); background: var(--green); color: #fff; }
    .all-overview-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .all-overview-grid.with-text { grid-template-columns: 1fr; gap: 10px; }
    .all-overview-card { min-width: 0; min-height: 84px; display: grid; place-items: center; align-content: center; padding: 7px 1px; border: 1px solid #ccd5cc; border-radius: 13px; background: #fff; color: var(--green); text-align: center; overflow: hidden; }
    .all-overview-card[role="button"] { cursor: pointer; touch-action: manipulation; }
    .all-overview-card[role="button"]:focus-visible { outline: 3px solid #78a889; outline-offset: 2px; }
    .all-overview-symbol { margin: 1px 0; font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", serif; font-size: calc(2.8rem * var(--scale)); font-weight: 800; line-height: .95; }
    .all-overview-name { display: block; max-width: 100%; font-size: min(calc(1.95rem * var(--scale)), 2.25rem); font-weight: 900; line-height: 1.05; letter-spacing: -.1em; white-space: nowrap; overflow: hidden; text-overflow: clip; }
    .all-overview-name.single { font-size: min(calc(2.7rem * var(--scale)), 3.25rem); letter-spacing: 0; }
    .all-overview-grid.with-text .all-overview-card, .all-overview-card.expanded { grid-column: 1 / -1; min-height: 0; display: block; padding: 12px; text-align: left; }
    .all-overview-grid.with-text .all-overview-head, .all-overview-card.expanded .all-overview-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .all-overview-grid.with-text .all-overview-symbol, .all-overview-card.expanded .all-overview-symbol { margin: 0; font-size: calc(2.25rem * var(--scale)); }
    .all-overview-copy { margin-top: 7px; color: #26352b; font-size: calc(1.06rem * var(--scale)); line-height: 1.55; overflow-wrap: anywhere; }
    .all-overview-copy .label { margin-bottom: 2px; }
    .all-overview-copy p { margin: 0; }
    .site-reference { margin: 22px 0 calc(18px + env(safe-area-inset-bottom)); color: #66736a; font-size: calc(.72rem * var(--scale)); line-height: 1.45; text-align: center; }
    .study-list { display: grid; gap: 12px; }
    .study-card, .single-card, .flash-card, .order-card, .english-card { overflow: hidden; border: 1px solid #d9d4c8; border-radius: 20px; background: #fff; box-shadow: 0 5px 18px #2033250d; }
    .study-card { display: grid; grid-template-columns: 94px 1fr; align-items: stretch; }
    .study-head { display: grid; place-items: center; align-content: center; padding: 14px 8px; background: #edf4ee; }
    .hex-symbol { font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", serif; color: var(--green); line-height: .9; }
    .study-head .hex-symbol { font-size: calc(4.8rem * var(--scale)); }
    .ordinal { margin-top: 8px; color: #607064; font-size: calc(.74rem * var(--scale)); }
    .study-body { min-width: 0; padding: 14px; }
    .hex-name { margin: 0 0 8px; font-size: calc(1.45rem * var(--scale)); color: var(--green); }
    .label { margin: 9px 0 2px; color: #6c766d; font-size: calc(.72rem * var(--scale)); font-weight: 800; letter-spacing: .08em; }
    .text { margin: 0; font-size: calc(1.06rem * var(--scale)); line-height: 1.65; }
    .plain[hidden] { display: none; }
    .picker-intro { margin: 0 0 12px; text-align: center; font-size: calc(1rem * var(--scale)); line-height: 1.55; color: #526056; }
    .picker-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; width: 100%; }
    .picker-item { min-width: 0; padding: 12px 2px 10px; border: 1px solid #ccd5cc; border-radius: 15px; background: #fff; color: var(--green); text-align: center; overflow: hidden; }
    .picker-item .hex-symbol { display: block; font-size: calc(7rem * var(--scale)); }
    .picker-name { display: block; margin-top: 7px; font-size: calc(.98rem * var(--scale)); font-weight: 850; white-space: nowrap; }
    .picker-no { display: block; margin-top: 2px; color: #718075; font-size: calc(.68rem * var(--scale)); }
    .single-card { padding: 14px 16px; text-align: center; touch-action: pan-y; }
    .single-card .hex-symbol { margin: 2px 0 -18px; font-size: calc(9.5rem * var(--scale)); font-weight: 800; -webkit-text-stroke: .6px currentColor; }
    .single-card .hex-name { margin-bottom: 4px; font-size: calc(2rem * var(--scale)); }
    .single-copy { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e6e2d8; text-align: left; }
    .single-copy .label { margin-top: 6px; }
    .single-copy .text { line-height: 1.45; }
    .swipe-hint { margin-top: 10px; color: #657168; font-size: calc(.82rem * var(--scale)); font-weight: 750; }
    .study-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .study-nav button { min-height: 46px; border: 1px solid #b8c3ba; border-radius: 13px; background: #fff; color: var(--green); font-size: calc(.9rem * var(--scale)); font-weight: 800; }
    .back-button { width: 100%; margin-top: 10px; min-height: 48px; border: 0; border-radius: 14px; color: #fff; background: var(--green); font-size: calc(1rem * var(--scale)); font-weight: 800; }
    .flash-card { padding: 14px 8px; text-align: center; }
    .flash-count { color: #617064; font-size: calc(.9rem * var(--scale)); }
    .flash-main .hex-symbol, .answer-cell .hex-symbol { display: block; margin: 18px auto 8px; }
    .flash-main .hex-symbol { margin-top: 8px; margin-bottom: -18px; }
    .flash-main .hex-symbol { font-size: calc(8rem * var(--scale)); }
    .answer-cell .hex-symbol { font-size: calc(8rem * var(--scale)); }
    .flash-main .hex-name, .answer-cell .hex-name { font-size: calc(1.9rem * var(--scale)); font-weight: 850; color: var(--green); }
    .flash-question { margin: 8px 0; font-size: calc(1rem * var(--scale)); font-weight: 800; }
    .flash-build-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .build-card { min-width: 0; padding: 8px 6px; border: 2px solid #c8d1c9; border-radius: 17px; background: #f8faf8; }
    .build-card.active { border-color: var(--green); background: #edf4ee; box-shadow: 0 0 0 2px #0b4f2c12; }
    .build-side-select { width: 100%; min-height: 34px; margin: 0 0 5px; padding: 1px; border: 0; background: transparent; color: var(--green); font-size: calc(1.05rem * var(--scale)); font-weight: 900; }
    .build-parts { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 5px; }
    .build-part { min-width: 0; min-height: 50px; padding: 5px 1px; border: 2px solid transparent; border-radius: 12px; background: #fff; color: #526056; font-size: calc(.86rem * var(--scale)); font-weight: 800; }
    .build-part.active { border-color: var(--green); background: var(--green); color: #fff; box-shadow: 0 0 0 2px #0b4f2c18; }
    .build-part.active .build-value { color: #fff; }
    .build-value { display: block; margin-top: 2px; color: var(--green); font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", sans-serif; font-size: calc(2.45rem * var(--scale)); font-weight: 900; line-height: 1; white-space: nowrap; }
    .build-value:empty { display: none; }
    .build-prompt { min-height: 1.5em; margin: 10px 0 7px; color: #526056; font-size: calc(.86rem * var(--scale)); font-weight: 800; }
    .trigram-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .trigram-choice { min-width: 0; min-height: 92px; padding: 4px 1px; border: 2px solid #b8c3ba; border-radius: 14px; background: #fff; color: var(--green); }
    .trigram-choice:active { transform: translateY(1px); }
    .trigram-symbol { display: block; font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", sans-serif; font-size: calc(3.2rem * var(--scale)); font-weight: 900; line-height: 1; }
    .flash-build-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
    .flash-build-actions button { min-height: 46px; padding: 7px 3px; border: 1px solid var(--green); border-radius: 13px; background: #fff; color: var(--green); font-size: calc(.9rem * var(--scale)); font-weight: 850; }
    .flash-build-actions .flash-submit { color: #fff; background: var(--green); }
    .flash-build-actions .flash-submit:disabled { opacity: .42; }
    .flash-answer { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .flash-answer[hidden] { display: none; }
    .answer-cell { min-width: 0; padding: 10px 2px; border: 2px solid transparent; border-radius: 16px; background: #edf4ee; overflow: hidden; }
    .answer-cell.correct { border-color: var(--green); }
    .answer-cell.wrong { border-color: #9c2f2f; background: #fff4f3; }
    .answer-label { color: #617064; font-size: calc(.82rem * var(--scale)); font-weight: 750; }
    .answer-mark { margin-top: 3px; color: var(--green); font-size: calc(.9rem * var(--scale)); font-weight: 900; }
    .answer-cell.wrong .answer-mark { color: #9c2f2f; }
    .answer-combo { margin-top: 4px; color: #617064; font-size: calc(.7rem * var(--scale)); font-weight: 750; line-height: 1.25; }
    .flash-answer .hex-symbol { margin-top: 7px; margin-bottom: -7px; font-size: calc(5.3rem * var(--scale)); }
    .flash-answer .hex-name { font-size: calc(1.45rem * var(--scale)); }
    .flash-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .flash-nav button, .reshuffle { min-height: 48px; border: 1px solid #b8c3ba; border-radius: 14px; background: #fff; font-size: calc(1rem * var(--scale)); font-weight: 800; }
    .reshuffle { width: 100%; margin-top: 9px; color: #fff; border-color: var(--green); background: var(--green); }
    .order-card { padding: 12px 14px 14px; text-align: center; }
    .order-title { margin: 0; color: var(--green); font-size: calc(1.05rem * var(--scale)); line-height: 1.2; white-space: nowrap; }
    .order-status { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; margin: 8px 0; }
    .order-progress { min-height: 1.5em; margin: 0; color: #617064; font-size: calc(.9rem * var(--scale)); font-weight: 750; text-align: left; }
    .order-symbol-toggle { min-height: 38px; padding: 6px 10px; border: 1px solid var(--green); border-radius: 12px; background: #fff; color: var(--green); font-size: calc(.86rem * var(--scale)); font-weight: 800; white-space: nowrap; }
    .order-length-control { display: grid; grid-template-columns: 1.35fr repeat(5, 1fr); gap: 4px; margin: 0 0 8px; }
    .order-length-control button { min-width: 0; min-height: 38px; padding: 4px 1px; border: 1px solid #b8c3ba; border-radius: 10px; background: #fff; color: var(--green); font-size: calc(.82rem * var(--scale)); font-weight: 850; white-space: nowrap; }
    .order-length-control button.active { border-color: var(--green); background: var(--green); color: #fff; }
    .order-practice-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; gap: 6px; margin: 0 0 8px; }
    .order-stats { min-width: 0; display: grid; align-content: center; gap: 1px; padding: 5px 8px; border-radius: 10px; background: #edf4ee; color: #526056; font-size: calc(.72rem * var(--scale)); font-weight: 800; line-height: 1.15; text-align: left; }
    .order-stats strong { color: var(--green); font-size: calc(.78rem * var(--scale)); }
    .order-stats small { color: #7a867d; font-size: calc(.64rem * var(--scale)); font-weight: 750; }
    .order-enhance { min-width: 88px; min-height: 42px; padding: 5px 8px; border: 1px solid var(--green); border-radius: 10px; background: #fff; color: var(--green); font-size: calc(.76rem * var(--scale)); font-weight: 850; line-height: 1.1; white-space: nowrap; }
    .order-enhance.active { color: #fff; background: var(--green); }
    .order-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .order-choice { position: relative; min-height: 64px; padding: 9px 8px; display: grid; place-items: center; align-content: center; border: 2px solid #b8c3ba; border-radius: 15px; background: #fff; color: var(--green); font-weight: 850; overflow: hidden; }
    .order-choice.with-symbol { min-height: 128px; padding-top: 5px; padding-bottom: 8px; }
    .order-choice.selected { color: #fff; border-color: var(--green); background: var(--green); }
    .order-hex { display: block; margin: -4px 0 0; color: currentColor; font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", serif; font-size: calc(4.6rem * var(--scale)); font-weight: 800; line-height: 1; -webkit-text-stroke: .4px currentColor; }
    .order-name { display: block; white-space: nowrap; font-size: calc(1.9rem * var(--scale)); line-height: 1; }
    .order-name.single { font-size: calc(2.2rem * var(--scale)); }
    .order-number { position: absolute; top: 7px; right: 7px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: var(--green); font-size: .86rem; font-weight: 900; box-shadow: 0 1px 4px #0002; }
    .order-feedback { min-height: 2.2em; margin: 8px 0 0; display: grid; place-items: center; color: #8b2727; font-size: calc(1rem * var(--scale)); font-weight: 800; line-height: 1.15; }
    .order-feedback.correct { color: var(--green); font-size: calc(1.12rem * var(--scale)); }
    .order-result { scroll-margin-bottom: max(18px, env(safe-area-inset-bottom)); }
    .order-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .order-actions button { min-height: 48px; padding: 8px 4px; border: 1px solid var(--green); border-radius: 14px; background: #fff; color: var(--green); font-size: calc(1rem * var(--scale)); font-weight: 800; white-space: nowrap; }
    .order-actions .next-order { color: #fff; background: var(--green); }
    .english-card { padding: 12px 14px 14px; text-align: center; }
    .english-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px; }
    .english-stat { padding: 5px 2px; border-radius: 10px; background: #edf4ee; color: #526056; font-size: calc(.7rem * var(--scale)); font-weight: 800; line-height: 1.15; }
    .english-stat strong { display: block; margin-top: 2px; color: var(--green); font-size: calc(.92rem * var(--scale)); }
    .english-prompt { padding: 4px 4px 8px; }
    .english-prompt .hex-symbol { display: block; margin: -10px 0 -22px; font-size: calc(9rem * var(--scale)); font-weight: 800; -webkit-text-stroke: .5px currentColor; }
    .english-chinese-name { margin: 0; color: var(--green); font-size: calc(2.25rem * var(--scale)); font-weight: 900; line-height: 1.05; }
    .english-question { margin: 9px 0 4px; color: #526056; font-size: calc(.88rem * var(--scale)); font-weight: 800; }
    .english-seen { margin: 0; color: #7a867d; font-size: calc(.68rem * var(--scale)); font-weight: 750; }
    .english-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 4px; }
    .english-tools button { min-width: 0; min-height: 44px; padding: 6px 4px; border: 1px solid var(--green); border-radius: 12px; background: #fff; color: var(--green); font-size: calc(.86rem * var(--scale)); font-weight: 850; }
    .english-tools button:disabled { opacity: .4; }
    .english-enhance.active { color: #fff; background: var(--green); }
    .english-options { display: grid; gap: 9px; margin-top: 10px; }
    .english-option { width: 100%; min-height: 78px; padding: 11px 10px; border: 2px solid #b8c3ba; border-radius: 16px; background: #fff; color: var(--green); font-family: Georgia, "Times New Roman", serif; font-size: calc(1.18rem * var(--scale)); font-weight: 800; line-height: 1.2; }
    .english-option:active { transform: translateY(1px); }
    .english-option:disabled { opacity: 1; }
    .english-option.correct { border-color: var(--green); background: var(--green); color: #fff; }
    .english-option.wrong { border-color: #9c2f2f; background: #fff4f3; color: #8b2727; }
    .english-feedback { min-height: 2.6em; margin: 9px 0 0; display: grid; place-items: center; color: #8b2727; font-size: calc(.92rem * var(--scale)); font-weight: 850; line-height: 1.25; }
    .english-feedback.correct { color: var(--green); }
    .english-next { width: 100%; min-height: 50px; margin-top: 8px; border: 1px solid var(--green); border-radius: 14px; background: var(--green); color: #fff; font-size: calc(1rem * var(--scale)); font-weight: 850; }
    .english-next:disabled { opacity: .35; }
    .empty { padding: 30px; text-align: center; color: #68746a; }
    @media (max-width: 370px) {
      .shell { padding-left: 8px; padding-right: 8px; }
      .control { font-size: calc(.82rem * var(--scale)); }
      .study-card { grid-template-columns: 82px 1fr; }
      .study-head .hex-symbol { font-size: calc(4.25rem * var(--scale)); }
      .picker-grid { gap: 6px; }
      .picker-item .hex-symbol { font-size: calc(6.2rem * var(--scale)); }
      .flash-main .hex-symbol { font-size: calc(7rem * var(--scale)); }
      .answer-cell .hex-symbol { font-size: calc(6.8rem * var(--scale)); }
    }
  </style>
</head>
<body>
  <span id="page-top" aria-hidden="true"></span>
  <main class="shell">
    <header>
      <h1>序卦傳・六十四卦記憶</h1>
      <p class="subtitle">原文、白話與前後卦閃卡</p>
    </header>

    <nav class="controls" aria-label="學習工具">
      <div class="control-row six">
        <button class="control" data-mode="all">全部</button>
        <button class="control" data-mode="upper">上經</button>
        <button class="control" data-mode="lower">下經</button>
        <button class="control" data-mode="flash">閃卡</button>
        <button class="control" data-mode="order">排序</button>
        <button class="control" data-mode="english">中英</button>
      </div>
      <div class="control-row three">
        <button class="control" id="font-down" aria-label="縮小文字">A−</button>
        <button class="control" id="font-reset">A 標準</button>
        <button class="control" id="font-up" aria-label="放大文字">A＋</button>
      </div>
      <div class="control-row three">
        <button class="control" id="plain-toggle">隱藏白話</button>
        <button class="control" id="top-button">回頂端</button>
        <button class="control" id="restart-button">重頭練習</button>
      </div>
      <div class="control-row one">
        <button class="control primary" id="picker-button">64卦</button>
      </div>
    </nav>

    <section id="list-screen" class="screen"></section>
    <section id="picker-screen" class="screen" hidden>
      <h2 class="section-title">六十四卦</h2>
      <p class="picker-intro">點選任一卦，直接查看該卦的《序卦傳》核心原文與白話。</p>
      <div id="picker-grid" class="picker-grid"></div>
    </section>

      const nextCorrect = chosenNext === next;
      const answerCell = (label, chosen, correctIndex, correct) => {
        const upper = trigrams[hexagramTrigrams[chosen][0]];
        const lower = trigrams[hexagramTrigrams[chosen][1]];
        return `<div class="answer-cell ${correct ? 'correct' : 'wrong'}"><div class="answer-label">${label}</div><div class="answer-mark">${correct ? '答對 ✓' : '答錯 ✕'}</div><div class="answer-combo">你選：${upper.symbol}＋${lower.symbol}</div><span class="hex-symbol">${hexagrams[correctIndex].symbol}</span><div class="hex-name">${hexagrams[correctIndex].name}</div></div>`;
      };
      flashChecked = true;
      const answer = document.getElementById('flash-answer');
      answer.innerHTML = answerCell('前一卦正解', chosenPrev, prev, prevCorrect) + answerCell('後一卦正解', chosenNext, next, nextCorrect);
      answer.hidden = false;
      updateFlashBuilder();
      centerFlashElement('.flash-answer');
    }
    function renderFlash() {
      resetFlashBuild();
      const i = deck[deckPosition];
      flashScreen.innerHTML = `<article class="flash-card"><div class="flash-count">第 ${deckPosition + 1} / 64 題</div><div class="flash-main"><span class="hex-symbol">${hexagrams[i].symbol}</span><div class="hex-name">${hexagrams[i].name}</div></div><div class="flash-question">八卦組合作答</div><div class="flash-build-summary"><div class="build-card" data-build-side="0"><button class="build-side-select" type="button" data-build-side-select="0">前一卦</button><div class="build-parts"><button class="build-part" type="button" data-build-index="0"><span>上卦</span><span class="build-value"></span></button><button class="build-part" type="button" data-build-index="1"><span>下卦</span><span class="build-value"></span></button></div></div><div class="build-card" data-build-side="1"><button class="build-side-select" type="button" data-build-side-select="1">後一卦</button><div class="build-parts"><button class="build-part" type="button" data-build-index="2"><span>上卦</span><span class="build-value"></span></button><button class="build-part" type="button" data-build-index="3"><span>下卦</span><span class="build-value"></span></button></div></div></div><div class="build-prompt" id="build-prompt"></div><div class="trigram-grid">${trigrams.map((trigram, index) => `<button class="trigram-choice" type="button" data-trigram-index="${index}" aria-label="選擇${trigram.name}卦"><span class="trigram-symbol">${trigram.symbol}</span></button>`).join('')}</div><div class="flash-build-actions"><button type="button" id="flash-clear">重新選擇</button><button class="flash-submit" type="button" id="flash-submit" disabled>確認答案</button></div><div class="flash-answer" id="flash-answer" hidden></div><div class="flash-nav"><button type="button" id="flash-prev">← 上一題</button><button type="button" id="flash-next">下一題 →</button></div><button class="reshuffle" type="button" id="reshuffle">重新隨機開始</button></article>`;
      document.querySelectorAll('[data-trigram-index]').forEach(button => button.addEventListener('click', () => {
        if (flashChecked || flashBuildStep < 0) return;
        const completedStep = flashBuildStep;
        flashBuild[completedStep] = Number(button.dataset.trigramIndex);
        if (completedStep % 2 === 0 && flashBuild[completedStep + 1] === null) {
          flashBuildStep = completedStep + 1;
        } else {
          flashBuildStep = flashBuild.findIndex(value => value === null);
        }
        updateFlashBuilder();
        focusFlashBuildInput();
      }));
      document.querySelectorAll('[data-build-side-select]').forEach(button => button.addEventListener('click', () => {
        if (flashChecked) return;
        const firstIndex = Number(button.dataset.buildSideSelect) * 2;
        flashBuildStep = flashBuild[firstIndex] === null ? firstIndex : flashBuild[firstIndex + 1] === null ? firstIndex + 1 : firstIndex;
        updateFlashBuilder();
        focusFlashBuildInput();
      }));
      document.querySelectorAll('[data-build-index]').forEach(button => button.addEventListener('click', () => {
        if (flashChecked) return;
        flashBuildStep = Number(button.dataset.buildIndex);
        updateFlashBuilder();
      }));
      document.getElementById('flash-clear').addEventListener('click', () => { resetFlashBuild(); document.getElementById('flash-answer').hidden = true; updateFlashBuilder(); });
      document.getElementById('flash-submit').addEventListener('click', checkFlashAnswer);
      document.getElementById('flash-prev').addEventListener('click', () => { deckPosition = (deckPosition + 63) % 64; renderFlash(); });
      document.getElementById('flash-next').addEventListener('click', () => { deckPosition = (deckPosition + 1) % 64; renderFlash(); });
      document.getElementById('reshuffle').addEventListener('click', () => { shuffleDeck(); renderFlash(); });
      updateFlashBuilder();
      alignFlashCard();
    }
    function updatePlain() {
      document.querySelectorAll('.plain').forEach(el => el.hidden = !showPlain);
      document.getElementById('plain-toggle').textContent = showPlain ? '隱藏白話' : '顯示白話';
    }
    function updateScale() {
      document.documentElement.style.setProperty('--scale', scales[scaleIndex]);
      try { localStorage.setItem(scaleStorageKey, String(scaleIndex)); } catch (_) {}
      if (currentMode === 'order' && !orderScreen.hidden) alignOrderCard();
      if (currentMode === 'english' && !englishScreen.hidden) alignEnglishCard();
    }

    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {
      const mode = button.dataset.mode;
      if (mode === 'flash') showFlash(true);
      else if (mode === 'order') showOrder(true);
      else if (mode === 'english') showEnglish(true);
      else showList(mode);
    }));
    document.getElementById('font-down').addEventListener('click', () => { scaleIndex = Math.max(0, scaleIndex - 1); updateScale(); });
    document.getElementById('font-reset').addEventListener('click', () => { scaleIndex = 1; updateScale(); });
    document.getElementById('font-up').addEventListener('click', () => { scaleIndex = Math.min(scales.length - 1, scaleIndex + 1); updateScale(); });
    document.getElementById('plain-toggle').addEventListener('click', () => { showPlain = !showPlain; updatePlain(); });
    document.getElementById('top-button').addEventListener('click', scrollTopNow);
    document.getElementById('restart-button').addEventListener('click', () => showFlash(true));
    document.getElementById('picker-button').addEventListener('click', () => showPicker());
    document.getElementById('picker-grid').innerHTML = hexagrams.map((item, i) => `<button class="picker-item" type="button" data-index="${i}"><span class="hex-symbol">${item.symbol}</span><span class="picker-name">${item.name}</span><span class="picker-no">第 ${i + 1} 卦</span></button>`).join('');
    document.getElementById('picker-grid').addEventListener('click', event => { const button = event.target.closest('.picker-item'); if (button) openStudy(Number(button.dataset.index)); });
    listScreen.addEventListener('click', event => {
      const button = event.target.closest('[data-all-field]');
      const card = event.target.closest('[data-all-card]');
      if (!['all', 'upper', 'lower'].includes(currentMode)) return;
      if (button) {
        const key = button.dataset.allField;
        const selectedCount = Object.values(allViewFields).filter(Boolean).length;
        if (allViewFields[key] && selectedCount === 1) return;
        allViewFields[key] = !allViewFields[key];
        allCardReveals.clear();
        showList(currentMode, false);
      } else if (card) revealNextAllCard(Number(card.dataset.allCard));
    });
    listScreen.addEventListener('keydown', event => {
      const card = event.target.closest('[data-all-card]');
      if (!card || !['all', 'upper', 'lower'].includes(currentMode) || (event.key !== 'Enter' && event.key !== ' ')) return;
      event.preventDefault();
      revealNextAllCard(Number(card.dataset.allCard));
    });
    orderScreen.addEventListener('click', event => {
      const choice = event.target.closest('[data-order-index]');
      const lengthChoice = event.target.closest('[data-order-length]');
      const action = event.target.closest('[data-order-action]');
      if (choice) {
        const index = Number(choice.dataset.orderIndex);
        const selectedPosition = orderSelections.indexOf(index);
        if (selectedPosition >= 0) orderSelections.splice(selectedPosition, 1);
        else if (orderSelections.length < orderSequence.length) orderSelections.push(index);
        const completedOrder = orderSelections.length === orderSequence.length;
        if (completedOrder) recordOrderAttempt(orderSelections.every((item, i) => item === orderSequence[i]));
        renderOrder();
        if (completedOrder && orderLengthMode !== '2') alignOrderResult();
      } else if (lengthChoice) {
        orderLengthMode = lengthChoice.dataset.orderLength;
        showOrder(true, orderLengthMode !== '2');
      } else if (action?.dataset.orderAction === 'reset') {
        orderSelections = [];
        renderOrder();
      } else if (action?.dataset.orderAction === 'symbols') {
        showOrderSymbols = !showOrderSymbols;
        renderOrder();
      } else if (action?.dataset.orderAction === 'enhance') {
        const key = currentOrderKey();
        if (orderEnhanced.has(key)) orderEnhanced.delete(key);
        else orderEnhanced.add(key);
        saveOrderEnhanced();
        renderOrder();
      } else if (action?.dataset.orderAction === 'next') {
        showOrder(true, orderLengthMode !== '2');
      }
    });
    englishScreen.addEventListener('click', event => {
      const option = event.target.closest('[data-english-index]');
      const action = event.target.closest('[data-english-action]');
      if (option && !englishAnswered) {
        englishSelectedIndex = Number(option.dataset.englishIndex);
        englishAnswered = true;
        recordEnglishAnswer(englishSelectedIndex === englishCurrentIndex);
        updateEnglishHistoryCurrent();
        renderEnglish(true);
      } else if (action?.dataset.englishAction === 'previous' && englishHistoryPosition > 0) {
        englishHistoryPosition -= 1;
        restoreEnglishSnapshot(englishHistory[englishHistoryPosition]);
        renderEnglish();
        alignEnglishCard();
      } else if (action?.dataset.englishAction === 'enhance') {
        if (englishEnhanced.has(englishCurrentIndex)) englishEnhanced.delete(englishCurrentIndex);
        else englishEnhanced.add(englishCurrentIndex);
        saveEnglishEnhanced();
        renderEnglish();
      } else if (action?.dataset.englishAction === 'next' && englishAnswered) {
        if (englishHistoryPosition < englishHistory.length - 1) {
          englishHistoryPosition += 1;
          restoreEnglishSnapshot(englishHistory[englishHistoryPosition]);
        } else {
          newEnglishQuestion();
        }
        renderEnglish();
        alignEnglishCard();
      }
    });
    singleScreen.addEventListener('touchstart', event => {
      if (event.touches.length !== 1) return;
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
    }, { passive: true });
    singleScreen.addEventListener('touchend', event => {
      if (event.changedTouches.length !== 1) return;
      completeStudySwipe(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
    }, { passive: true });
    singleScreen.addEventListener('touchcancel', () => { touchStartX = null; touchStartY = null; }, { passive: true });
    singleScreen.addEventListener('pointerdown', event => {
      if (event.pointerType === 'touch') return;
      touchStartX = event.clientX;
      touchStartY = event.clientY;
    });
    singleScreen.addEventListener('pointerup', event => {
      if (event.pointerType === 'touch') return;
      completeStudySwipe(event.clientX, event.clientY);
    });
    singleScreen.addEventListener('pointercancel', () => { touchStartX = null; touchStartY = null; });
    try { const saved = localStorage.getItem(scaleStorageKey); if (saved !== null && ['0','1','2','3'].includes(saved)) scaleIndex = Number(saved); } catch (_) {}
    updateScale();
    updatePlain();
    showList('all', false);
  </script>
</body>
</html>
