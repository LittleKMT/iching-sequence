<!doctype html>
<html lang="zh-Hant">
<head>

  <title>序卦傳・六十四卦記憶</title>
  <style>
    :root { --scale: 1; --green: #0b4f2c; --cream: #f5f1e8; --ink: #172019; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--cream); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
    button { font: inherit; }
    #page-top { position: absolute; top: 0; }
    .shell { width: min(100%, 680px); margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 12px calc(34px + env(safe-area-inset-bottom)); }
    header { text-align: center; padding: 8px 4px 14px; }
    h1 { margin: 0; color: var(--green); font-size: calc(1.75rem * var(--scale)); line-height: 1.25; }
    .subtitle { margin: 6px 0 0; font-size: calc(.95rem * var(--scale)); color: #526056; }
    .controls { position: sticky; top: 0; z-index: 20; margin: 0 -2px 10px; padding: 4px 2px; background: color-mix(in srgb, var(--cream) 94%, transparent); backdrop-filter: blur(10px); }

    .controls.all-focus { position: relative; top: auto; backdrop-filter: none; }
    .controls.english-focus { position: relative; top: auto; backdrop-filter: none; }
    .controls.order-focus { display: none; }
    .controls.query-focus { display: none; }
    .controls.overview-focus { display: none; }
    header.query-focus-header { display: none; }
    header.overview-focus-header { display: none; }
    .controls:not(.flash-focus) .flash-only-row { display: none; }
    .control-row { display: grid; gap: 5px; margin-bottom: 3px; }
    .control-row.five { grid-template-columns: repeat(5, 1fr); }
    .control-row.six { grid-template-columns: repeat(6, 1fr); }
    .control-row.four { grid-template-columns: repeat(4, 1fr); }
    .control-row.three { grid-template-columns: repeat(3, 1fr); }

    .control-row.one { grid-template-columns: 1fr; margin-bottom: 0; }
    .control { min-width: 0; min-height: 44px; padding: 9px 4px; border: 1px solid #bdc6bd; border-radius: 12px; background: #fff; color: #1c2820; font-size: calc(.92rem * var(--scale)); font-weight: 750; box-shadow: 0 1px 2px #0000000c; }
    .control:active { transform: translateY(1px); }
    .control.active, .control.primary { color: #fff; border-color: var(--green); background: var(--green); }
    .screen[hidden] { display: none !important; }
    #flash-screen, #order-screen, #english-screen { padding-bottom: 45vh; }
    #flash-screen { scroll-margin-top: max(8px, env(safe-area-inset-top)); }
    .section-title { margin: 18px 0 10px; font-size: calc(1.25rem * var(--scale)); color: var(--green); }
    .all-view-options { position: sticky; top: max(0px, env(safe-area-inset-top)); z-index: 25; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin: 0 0 10px; padding: 6px 0; background: color-mix(in srgb, var(--cream) 96%, transparent); backdrop-filter: blur(10px); }
    .all-view-options.non-sticky { position: static; background: transparent; backdrop-filter: none; }
    .all-view-options button { min-width: 0; min-height: 42px; padding: 6px 2px; border: 1px solid #b8c3ba; border-radius: 11px; background: #fff; color: var(--green); font-size: calc(.86rem * var(--scale)); font-weight: 850; }
    .all-view-options button.active { border-color: var(--green); background: var(--green); color: #fff; }
    .all-overview-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }

    .all-overview-name { display: block; max-width: 100%; font-size: min(calc(1.95rem * var(--scale)), 2.25rem); font-weight: 900; line-height: 1.05; letter-spacing: -.1em; white-space: nowrap; overflow: hidden; text-overflow: clip; }

    .query-card { padding: 16px 14px 18px; }

    .query-index-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .query-index-item { min-width: 0; min-height: 84px; padding: 7px 2px; display: grid; place-items: center; border: 1px solid #ccd5cc; border-radius: 13px; background: #fff; color: var(--green); text-align: center; }
    .query-index-name { display: block; max-width: 100%; font-size: min(calc(1.9rem * var(--scale)), 2.25rem); font-weight: 900; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: clip; }
    .query-index-name.single { font-size: min(calc(2.7rem * var(--scale)), 3.25rem); }

    .query-yao-row { scroll-margin-top: 12px; }

    .query-yao-label { display: inline-block; min-width: 3.1em; margin-right: 5px; color: var(--green); font-weight: 900; }

    .query-yao-progress { margin-top: 8px; padding: 9px; border: 1px solid #c5d8c9; border-radius: 10px; background: #fff; }

    .query-yao-progress-actions .important { border-color: #b97818; background: #fff8e8; color: #915400; }

    .query-yao-read-history { margin: 0; padding-left: 1.4em; color: #617064; font-size: calc(.73rem * var(--scale)); line-height: 1.5; }

    .query-detail-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 13px; }

    .overview-card { padding: 12px 2px 20px; }

    .overview-title { margin: 2px 0 5px; color: var(--green); font-size: calc(1.45rem * var(--scale)); text-align: center; }

    .overview-summary-item strong { display: block; margin-top: 3px; color: var(--green); font-size: calc(1rem * var(--scale)); }
    .overview-filters { position: sticky; top: max(0px, env(safe-area-inset-top)); z-index: 8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 6px 0; background: color-mix(in srgb, var(--cream) 96%, transparent); backdrop-filter: blur(10px); }
    .overview-filter { min-width: 0; min-height: 42px; padding: 5px 2px; border: 1px solid #b8c3ba; border-radius: 11px; background: #fff; color: var(--green); font-size: calc(.7rem * var(--scale)); font-weight: 850; line-height: 1.15; }

    .overview-count { margin: 3px 2px 8px; color: #617064; font-size: calc(.75rem * var(--scale)); font-weight: 800; }

    .study-head .hex-symbol { font-size: calc(4.8rem * var(--scale)); }

        const lower = trigrams[hexagramTrigrams[chosen][1]];
        return `<div class="answer-cell ${correct ? 'correct' : 'wrong'}"><div class="answer-label">${label}</div><div class="answer-mark">${correct ? '答對 ✓' : '答錯 ✕'}</div><div class="answer-combo">你選：${upper.symbol}＋${lower.symbol}</div><span class="hex-symbol">${hexagrams[correctIndex].symbol}</span><div class="hex-name">${hexagrams[correctIndex].name}</div></div>`;
      };
      flashChecked = true;
      const answer = document.getElementById('flash-answer');
      answer.innerHTML = answerCell('前一卦正解', chosenPrev, prev, prevCorrect) + answerCell('後一卦正解', chosenNext, next, nextCorrect);
      answer.hidden = false;
      updateFlashBuilder();
      centerFlashElement('.flash-answer');
    }
    function renderFlash() {
      resetFlashBuild();
      const i = deck[deckPosition];
      flashScreen.innerHTML = `<article class="flash-card"><div class="flash-count">第 ${deckPosition + 1} / 64 題</div><div class="flash-main"><span class="hex-symbol">${hexagrams[i].symbol}</span><div class="hex-name">${hexagrams[i].name}</div></div><div class="flash-question">八卦組合作答</div><div class="flash-build-summary"><div class="build-card" data-build-side="0"><button class="build-side-select" type="button" data-build-side-select="0">前一卦</button><div class="build-parts"><button class="build-part" type="button" data-build-index="0"><span>上卦</span><span class="build-value"></span></button><button class="build-part" type="button" data-build-index="1"><span>下卦</span><span class="build-value"></span></button></div></div><div class="build-card" data-build-side="1"><button class="build-side-select" type="button" data-build-side-select="1">後一卦</button><div class="build-parts"><button class="build-part" type="button" data-build-index="2"><span>上卦</span><span class="build-value"></span></button><button class="build-part" type="button" data-build-index="3"><span>下卦</span><span class="build-value"></span></button></div></div></div><div class="build-prompt" id="build-prompt"></div><div class="trigram-grid">${trigrams.map((trigram, index) => `<button class="trigram-choice" type="button" data-trigram-index="${index}" aria-label="選擇${trigram.name}卦"><span class="trigram-symbol">${trigram.symbol}</span></button>`).join('')}</div><div class="flash-build-actions"><button type="button" id="flash-clear">重新選擇</button><button class="flash-submit" type="button" id="flash-submit" disabled>確認答案</button></div><div class="flash-answer" id="flash-answer" hidden></div><div class="flash-nav"><button type="button" id="flash-prev">← 上一題</button><button type="button" id="flash-next">下一題 →</button></div><button class="reshuffle" type="button" id="reshuffle">重新隨機開始</button></article>`;
      document.querySelectorAll('[data-trigram-index]').forEach(button => button.addEventListener('click', () => {
        if (flashChecked || flashBuildStep < 0) return;
        const completedStep = flashBuildStep;
        flashBuild[completedStep] = Number(button.dataset.trigramIndex);
        if (completedStep % 2 === 0 && flashBuild[completedStep + 1] === null) {
          flashBuildStep = completedStep + 1;
        } else {
          flashBuildStep = flashBuild.findIndex(value => value === null);
        }
        updateFlashBuilder();
        focusFlashBuildInput();
      }));
      document.querySelectorAll('[data-build-side-select]').forEach(button => button.addEventListener('click', () => {
        if (flashChecked) return;
        const firstIndex = Number(button.dataset.buildSideSelect) * 2;
        flashBuildStep = flashBuild[firstIndex] === null ? firstIndex : flashBuild[firstIndex + 1] === null ? firstIndex + 1 : firstIndex;
        updateFlashBuilder();
        focusFlashBuildInput();
      }));
      document.querySelectorAll('[data-build-index]').forEach(button => button.addEventListener('click', () => {
        if (flashChecked) return;
        flashBuildStep = Number(button.dataset.buildIndex);
        updateFlashBuilder();
      }));
      document.getElementById('flash-clear').addEventListener('click', () => { resetFlashBuild(); document.getElementById('flash-answer').hidden = true; updateFlashBuilder(); });
      document.getElementById('flash-submit').addEventListener('click', checkFlashAnswer);
      document.getElementById('flash-prev').addEventListener('click', () => { deckPosition = (deckPosition + 63) % 64; renderFlash(); });
      document.getElementById('flash-next').addEventListener('click', () => { deckPosition = (deckPosition + 1) % 64; renderFlash(); });
      document.getElementById('reshuffle').addEventListener('click', () => { shuffleDeck(); renderFlash(); });
      updateFlashBuilder();
      alignFlashCard();
    }
    function updatePlain() {
      document.querySelectorAll('.plain').forEach(el => el.hidden = !showPlain);
      document.getElementById('plain-toggle').textContent = showPlain ? '隱藏白話' : '顯示白話';
    }
    function updateScale() {
      document.documentElement.style.setProperty('--scale', scales[scaleIndex]);
      try { localStorage.setItem(scaleStorageKey, String(scaleIndex)); } catch (_) {}
      if (currentMode === 'order' && !orderScreen.hidden) alignOrderCard();
      if (currentMode === 'english' && !englishScreen.hidden) alignEnglishCard();
    }

    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {
      const mode = button.dataset.mode;
      if (mode === 'flash') showFlash(true);
      else if (mode === 'order') showOrder(true);
      else if (mode === 'english') showEnglish(true);
      else if (mode === 'query') showQuery(true, '', 'all');
      else if (mode === 'overview') showLearningOverview(true);
      else showList(mode);
    }));
    document.getElementById('font-down').addEventListener('click', () => { scaleIndex = Math.max(0, scaleIndex - 1); updateScale(); });
    document.getElementById('font-reset').addEventListener('click', () => { scaleIndex = 1; updateScale(); });
    document.getElementById('font-up').addEventListener('click', () => { scaleIndex = Math.min(scales.length - 1, scaleIndex + 1); updateScale(); });
    document.getElementById('plain-toggle').addEventListener('click', () => { showPlain = !showPlain; updatePlain(); });
    document.getElementById('top-button').addEventListener('click', scrollTopNow);
    document.getElementById('restart-button').addEventListener('click', () => showFlash(true));
    document.getElementById('picker-button').addEventListener('click', () => showPicker());
    document.getElementById('picker-grid').innerHTML = hexagrams.map((item, i) => `<button class="picker-item" type="button" data-index="${i}"><span class="hex-symbol">${item.symbol}</span><span class="picker-name">${item.name}</span><span class="picker-no">第 ${i + 1} 卦</span></button>`).join('');
    document.getElementById('picker-grid').addEventListener('click', event => { const button = event.target.closest('.picker-item'); if (button) openStudy(Number(button.dataset.index)); });
    queryScreen.addEventListener('submit', event => {
      if (event.target.id !== 'query-form') return;
      event.preventDefault();
      const input = queryScreen.querySelector('#query-input');
      renderQuery(input?.value || '');

    });
    queryScreen.addEventListener('click', event => {
      const readAction = event.target.closest('[data-query-yao-read]');
      const importantAction = event.target.closest('[data-query-yao-important]');
      if (readAction || importantAction) {
        event.preventDefault();
        const action = readAction || importantAction;
        const number = Number(action.dataset.queryYaoNumber);
        const label = action.dataset.queryYaoLabel || '';
        const progress = getQueryYaoProgress(number, label);
        if (readAction) progress.reads.push(new Date().toISOString());
        else progress.important = !progress.important;
        setQueryYaoProgress(number, label, progress);
        refreshQueryYaoProgressRow(action.closest('.query-yao-row'), number, label);
        return;
      }
      if (event.target.closest('[data-query-home]')) {
        if (queryReturnMode === 'overview') showLearningOverview();
        else showList('all');
        return;
      }
      const item = event.target.closest('[data-query-number]');
      if (item) {
        const term = queryScreen.querySelector('#query-input')?.value || '';
        const number = Number(item.dataset.queryNumber);
        const current = Number(queryScreen.dataset.selectedNumber || 0);
        if (current === number) {
          renderQuery(term);
        } else {
          renderQuery(term, number);
          if (!window.heartMindLectureData) loadHeartMindLectureData().then(() => renderQuery(term, number)).catch(() => {});
        }
        scrollTopNow();
      } else if (event.target.closest('[data-query-back]')) {
        renderQuery(queryScreen.querySelector('#query-input')?.value || '');
        scrollTopNow();
      }
    });
    overviewScreen.addEventListener('click', event => {
      const filter = event.target.closest('[data-overview-filter]');
      const selected = event.target.closest('[data-overview-number]');
      if (event.target.closest('[data-overview-home]')) {
        showList('all');
      } else if (filter) {
        overviewFilter = filter.dataset.overviewFilter || 'all';
        renderLearningOverview();
        scrollTopNow();
      } else if (selected) {
        const number = Number(selected.dataset.overviewNumber);
        showQuery(false, '', 'overview');
        renderQuery('', number);
        if (!window.heartMindLectureData) loadHeartMindLectureData().then(() => {
          renderQuery('', number);
          scrollTopNow();
          requestAnimationFrame(scrollTopNow);
        }).catch(() => {});
        scrollTopNow();
        requestAnimationFrame(scrollTopNow);
        setTimeout(scrollTopNow, 0);
      }
    });
    listScreen.addEventListener('click', event => {
      const button = event.target.closest('[data-all-field]');
      const card = event.target.closest('[data-all-card]');
      if (!['all', 'upper', 'lower'].includes(currentMode)) return;
      if (button) {
        const key = button.dataset.allField;
        const selectedCount = Object.values(allViewFields).filter(Boolean).length;
        if (allViewFields[key] && selectedCount === 1) return;
        allViewFields[key] = !allViewFields[key];
        allCardReveals.clear();
        showList(currentMode, false);
      } else if (card) revealNextAllCard(Number(card.dataset.allCard));
    });
    listScreen.addEventListener('keydown', event => {
      const card = event.target.closest('[data-all-card]');
      if (!card || !['all', 'upper', 'lower'].includes(currentMode) || (event.key !== 'Enter' && event.key !== ' ')) return;
      event.preventDefault();
      revealNextAllCard(Number(card.dataset.allCard));
    });
    orderScreen.addEventListener('click', event => {
      const choice = event.target.closest('[data-order-index]');
      const lengthChoice = event.target.closest('[data-order-length]');
      const action = event.target.closest('[data-order-action]');
      if (choice) {
        const index = Number(choice.dataset.orderIndex);
        const selectedPosition = orderSelections.indexOf(index);
        if (selectedPosition >= 0) orderSelections.splice(selectedPosition, 1);
        else if (orderSelections.length < orderSequence.length) orderSelections.push(index);
        const completedOrder = orderSelections.length === orderSequence.length;
        if (completedOrder) recordOrderAttempt(orderSelections.every((item, i) => item === orderSequence[i]));
        renderOrder(true);
      } else if (lengthChoice) {
        orderLengthMode = lengthChoice.dataset.orderLength;
        newOrderQuestion();
        renderOrder(true);
      } else if (action?.dataset.orderAction === 'home') {
        showList('all');
      } else if (action?.dataset.orderAction === 'reset') {
        orderSelections = [];
        renderOrder(true);
      } else if (action?.dataset.orderAction === 'symbols') {
        showOrderSymbols = !showOrderSymbols;
        renderOrder(true);
      } else if (action?.dataset.orderAction === 'enhance') {
        const key = currentOrderKey();
        if (orderEnhanced.has(key)) orderEnhanced.delete(key);
        else orderEnhanced.add(key);
        saveOrderEnhanced();
        orderStartDecks.delete(orderSequence.length);
        renderOrder(true);
      } else if (action?.dataset.orderAction === 'next') {
        newOrderQuestion();
        renderOrder(true);
      }
    });
    englishScreen.addEventListener('click', event => {
      const option = event.target.closest('[data-english-index]');
      const action = event.target.closest('[data-english-action]');
      if (option && !englishAnswered) {
        englishSelectedIndex = Number(option.dataset.englishIndex);
        englishAnswered = true;
        recordEnglishAnswer(englishSelectedIndex === englishCurrentIndex);
        updateEnglishHistoryCurrent();
        renderEnglish(true);
      } else if (action?.dataset.englishAction === 'flip' && isEnglishFlashMode()) {
        if (englishFlashSuppressClick) {
          englishFlashSuppressClick = false;
          return;
        }
        englishFlashRevealed = !englishFlashRevealed;
        updateEnglishHistoryCurrent();
        renderEnglish(true);
      } else if (action?.dataset.englishAction === 'previous' && englishHistoryPosition > 0) {
        englishHistoryPosition -= 1;
        restoreEnglishSnapshot(englishHistory[englishHistoryPosition]);
        const preserveFlashPosition = isEnglishFlashMode();
        renderEnglish(preserveFlashPosition);
        if (!preserveFlashPosition) alignEnglishCard();
      } else if (action?.dataset.englishAction === 'enhance') {
        if (englishEnhanced.has(englishCurrentIndex)) englishEnhanced.delete(englishCurrentIndex);
        else englishEnhanced.add(englishCurrentIndex);
        saveEnglishEnhanced();
        renderEnglish();
      } else if (action?.dataset.englishAction === 'mode') {
        const requestedMode = action.dataset.englishMode;
        const nextMode = requestedMode === 'sequence' || requestedMode === 'flashcard' || requestedMode === 'reverse-flashcard' ? requestedMode : 'random';
        if (englishMode === nextMode) return;
        englishMode = nextMode;
        try { localStorage.setItem(englishModeStorageKey, englishMode); } catch (_) {}
        englishDeck = [];
        englishDeckPosition = 0;
        englishCurrentIndex = null;
        englishHistory = [];
        englishHistoryPosition = -1;
        newEnglishQuestion();
        renderEnglish();
        alignEnglishCard();
      } else if (action?.dataset.englishAction === 'next' && (englishAnswered || isEnglishFlashMode())) {
        if (englishHistoryPosition < englishHistory.length - 1) {
          englishHistoryPosition += 1;
          restoreEnglishSnapshot(englishHistory[englishHistoryPosition]);
        } else {
          newEnglishQuestion();
        }
        const preserveFlashPosition = isEnglishFlashMode();
        renderEnglish(preserveFlashPosition);
        if (!preserveFlashPosition) alignEnglishCard();
      }
    });
    englishScreen.addEventListener('pointerdown', event => {
      if (!isEnglishFlashMode() || !event.isPrimary || !event.target.closest('.english-flip-card')) return;
      englishFlashTouchStartX = event.clientX;
      englishFlashTouchStartY = event.clientY;
    });
    englishScreen.addEventListener('pointerup', event => {
      if (!isEnglishFlashMode() || !event.isPrimary || englishFlashTouchStartX === null || englishFlashTouchStartY === null) return;
      const deltaX = event.clientX - englishFlashTouchStartX;
      const deltaY = event.clientY - englishFlashTouchStartY;
      englishFlashTouchStartX = null;
      englishFlashTouchStartY = null;
      if (Math.abs(deltaX) <= 48 || Math.abs(deltaX) <= Math.abs(deltaY) * 1.15) return;
      englishFlashSuppressClick = true;
      if (deltaX > 0) {
        if (englishHistoryPosition < englishHistory.length - 1) {
          englishHistoryPosition += 1;
          restoreEnglishSnapshot(englishHistory[englishHistoryPosition]);
        } else {
          newEnglishQuestion();
        }
        renderEnglish(true);
      } else if (englishHistoryPosition > 0) {
        englishHistoryPosition -= 1;
        restoreEnglishSnapshot(englishHistory[englishHistoryPosition]);
        renderEnglish(true);
      }
      setTimeout(() => { englishFlashSuppressClick = false; }, 450);
    });
    englishScreen.addEventListener('pointercancel', () => {
      englishFlashTouchStartX = null;
      englishFlashTouchStartY = null;
    });
    singleScreen.addEventListener('touchstart', event => {
      if (event.touches.length !== 1) return;
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
    }, { passive: true });
    singleScreen.addEventListener('touchend', event => {
      if (event.changedTouches.length !== 1) return;
      completeStudySwipe(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
    }, { passive: true });
    singleScreen.addEventListener('touchcancel', () => { touchStartX = null; touchStartY = null; }, { passive: true });
    singleScreen.addEventListener('pointerdown', event => {
      if (event.pointerType === 'touch') return;
      touchStartX = event.clientX;
      touchStartY = event.clientY;
    });
    singleScreen.addEventListener('pointerup', event => {
      if (event.pointerType === 'touch') return;
      completeStudySwipe(event.clientX, event.clientY);
    });
    singleScreen.addEventListener('pointercancel', () => { touchStartX = null; touchStartY = null; });
    try { const savedEnglishMode = localStorage.getItem(englishModeStorageKey); if (savedEnglishMode === 'sequence' || savedEnglishMode === 'random' || savedEnglishMode === 'flashcard' || savedEnglishMode === 'reverse-flashcard') englishMode = savedEnglishMode; } catch (_) {}
    try { const saved = localStorage.getItem(scaleStorageKey); if (saved !== null && ['0','1','2','3'].includes(saved)) scaleIndex = Number(saved); } catch (_) {}
    updateScale();
    updatePlain();
    showList('all', false);
  </script>
</body>
</html>
